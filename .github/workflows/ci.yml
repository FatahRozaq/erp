name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/requirements-contracts.txt
      - run: python scripts/validate_contracts.py
      - run: python scripts/validate_backlog.py
      - run: python scripts/check_migration_inventory.py
  sqlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned sqlc
        run: |
          curl -fsSL --retry 2 -o /tmp/sqlc.tar.gz https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz
          echo '497ae4fcdfa64c5b0c311ffe4c2bd991e43991e82e5367792ed78bc2dca27354  /tmp/sqlc.tar.gz' | sha256sum -c -
          mkdir -p /tmp/erp-sqlc
          tar -xzf /tmp/sqlc.tar.gz -C /tmp/erp-sqlc sqlc
      - name: Generate sqlc and check drift
        run: |
          cd backend/database
          /tmp/erp-sqlc/sqlc generate
          cd ../..
          test -z "$(git status --porcelain -- backend/golang/services/platform/internal/master/adapters/postgres/sqlc)"
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, platform, commercial, operations, finance]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/golang/services/${{ matrix.service }}/go.mod
          cache-dependency-path: backend/golang/services/${{ matrix.service }}/go.sum
      - working-directory: backend/golang/services/${{ matrix.service }}
        run: test -z "$(gofmt -l cmd internal)" && go vet ./... && go test ./... && go build -o /tmp/erp-api ./cmd/api
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/nextjs/package-lock.json
      - working-directory: frontend/nextjs
        run: npm ci
      - working-directory: frontend/nextjs
        run: npm run format:check && npm run lint && npm run typecheck && npm run contracts:check && npm test && npm run build && npm audit --audit-level=high
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - working-directory: mobile/flutter
        run: flutter pub get --enforce-lockfile
      - working-directory: mobile/flutter
        run: dart format --output=none --set-exit-if-changed lib test && flutter analyze && flutter test && flutter build web

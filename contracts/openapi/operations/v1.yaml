components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Entity:
      name: X-Legal-Entity-Guid
      in: header
      required: true
      schema:
        type: string
        format: uuid
    Guid:
      name: guid
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
  responses:
    Problem:
      description: Stable scoped error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            success: false
            code: INVENTORY_INSUFFICIENT_AVAILABLE
            message: Not enough stock
            details: {}
            request_id: req-01990f5b
  schemas:
    Qty:
      type: string
      pattern: ^\d{1,14}(\.\d{1,6})?$
    ReserveRequest:
      type: object
      additionalProperties: false
      required:
      - sales_order_guid
      - sales_order_line_guid
      - sku_guid
      - warehouse_guid
      - qty_base
      properties:
        sales_order_guid:
          type: string
          format: uuid
        sales_order_line_guid:
          type: string
          format: uuid
        sku_guid:
          type: string
          format: uuid
        warehouse_guid:
          type: string
          format: uuid
        qty_base:
          $ref: '#/components/schemas/Qty'
    Reservation:
      type: object
      additionalProperties: false
      required:
      - guid
      - sales_order_line_guid
      - status
      - requested_qty_base
      - held_qty_base
      - version
      properties:
        guid:
          type: string
          format: uuid
        sales_order_line_guid:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - HELD
          - ALLOCATED
          - BACKORDERED
          - CONSUMED
          - RELEASED
          - EXPIRED
        requested_qty_base:
          $ref: '#/components/schemas/Qty'
        held_qty_base:
          $ref: '#/components/schemas/Qty'
        version:
          type: integer
          minimum: 1
    Reason:
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
    StockBalance:
      type: object
      additionalProperties: false
      required:
      - warehouse_guid
      - sku_guid
      - status
      - physical_qty_base
      - reserved_qty_base
      - available_qty_base
      - as_of
      properties:
        warehouse_guid:
          type: string
          format: uuid
        sku_guid:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - SELLABLE
          - HOLD
          - DAMAGED
          - IN_TRANSIT
        physical_qty_base:
          $ref: '#/components/schemas/Qty'
        reserved_qty_base:
          $ref: '#/components/schemas/Qty'
        available_qty_base:
          $ref: '#/components/schemas/Qty'
        as_of:
          type: string
          format: date-time
    CreateAdjustment:
      type: object
      additionalProperties: false
      required:
      - warehouse_guid
      - sku_guid
      - book_qty_base
      - counted_qty_base
      - business_date
      - reason
      - evidence_guid
      properties:
        warehouse_guid:
          type: string
          format: uuid
        sku_guid:
          type: string
          format: uuid
        lot_guid:
          type:
          - string
          - 'null'
          format: uuid
        book_qty_base:
          $ref: '#/components/schemas/Qty'
        counted_qty_base:
          $ref: '#/components/schemas/Qty'
        business_date:
          type: string
          format: date
        reason:
          type: string
          minLength: 3
          maxLength: 500
        evidence_guid:
          type: string
          format: uuid
    Adjustment:
      type: object
      additionalProperties: false
      required:
      - guid
      - status
      - delta_qty_base
      - version
      properties:
        guid:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - DRAFT
          - APPROVED
          - POSTED
          - REJECTED
        delta_qty_base:
          type: string
          pattern: ^-?\d{1,14}(\.\d{1,6})?$
        version:
          type: integer
          minimum: 1
    PickTask:
      type: object
      additionalProperties: false
      required:
      - guid
      - status
      - allocated_qty_base
      - picked_qty_base
      - version
      properties:
        guid:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - OPEN
          - IN_PROGRESS
          - PICKED
          - PACKED
          - DISPATCHED
          - EXCEPTION
        allocated_qty_base:
          $ref: '#/components/schemas/Qty'
        picked_qty_base:
          $ref: '#/components/schemas/Qty'
        lease_expires_at:
          type:
          - string
          - 'null'
          format: date-time
        version:
          type: integer
          minimum: 1
    PickScan:
      type: object
      additionalProperties: false
      required:
      - pick_line_guid
      - sku_guid
      - qty_base
      - device_guid
      properties:
        pick_line_guid:
          type: string
          format: uuid
        sku_guid:
          type: string
          format: uuid
        lot_guid:
          type:
          - string
          - 'null'
          format: uuid
        serial_no:
          type:
          - string
          - 'null'
        qty_base:
          $ref: '#/components/schemas/Qty'
        device_guid:
          type: string
          format: uuid
    DispatchRequest:
      type: object
      additionalProperties: false
      required:
      - pick_task_guid
      - business_date
      - carrier_ref
      - packs
      properties:
        pick_task_guid:
          type: string
          format: uuid
        business_date:
          type: string
          format: date
        carrier_ref:
          type: string
          minLength: 1
          maxLength: 128
        packs:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - pack_guid
            - lines
            properties:
              pack_guid: &id004
                type: string
                format: uuid
              lines:
                type: array
                minItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - source_portion_guid
                  - quantity_base
                  properties:
                    source_portion_guid: *id004
                    quantity_base: &id011
                      $ref: '#/components/schemas/Qty'
    PodRequest:
      type: object
      additionalProperties: false
      required:
      - recipient_name
      - evidence_guid
      - evidence_sha256
      - lines
      properties:
        recipient_name:
          type: string
          minLength: 1
          maxLength: 200
        evidence_guid:
          type: string
          format: uuid
        evidence_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        lines:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - delivery_line_guid
            - accepted_qty_base
            - rejected_qty_base
            properties:
              delivery_line_guid:
                type: string
                format: uuid
              accepted_qty_base:

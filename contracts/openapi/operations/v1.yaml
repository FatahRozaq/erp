openapi: 3.1.1
info:
  title: ERP Inventory Control and WMS API
  version: 1.0.0
  description: MVP reservation, stock inquiry, adjustment, picking and delivery; goods receipt remains
    in inventory/v1.yaml.
servers:
- url: https://erp.example.invalid
security:
- bearerAuth: []
paths:
  /api/v1/inventory/reservations:
    post:
      operationId: reserveStock
      x-permission: inventory.reserve
      description: Service-only command after Sales approval acknowledgement; shortage returns BACKORDERED,
        never negative stock.
      parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReserveRequest'
            example:
              sales_order_guid: 01990f5b-bbb9-7000-8000-000000000001
              sales_order_line_guid: 01990f5b-bbb9-7000-8000-000000000001
              sku_guid: 01990f5b-bbb9-7000-8000-000000000001
              warehouse_guid: 01990f5b-bbb9-7000-8000-000000000001
              qty_base: '5'
      responses:
        '201':
          description: Reservation or backorder result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                sales_order_line_guid: 01990f5b-bbb9-7000-8000-000000000001
                status: HELD
                requested_qty_base: '5'
                held_qty_base: '5'
                version: 1
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/inventory/reservations/{guid}/release:
    post:
      operationId: releaseReservation
      x-permission: inventory.release
      parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/Guid'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
            example:
              reason: example
      responses:
        '200':
          description: Released once; duplicate command returns first result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                sales_order_line_guid: 01990f5b-bbb9-7000-8000-000000000001
                status: RELEASED
                requested_qty_base: '5'
                held_qty_base: '5'
                version: 1
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
  /api/v1/inventory/stock-balances:
    get:
      operationId: listStockBalances
      x-permission: inventory.stock.view
      parameters:
      - $ref: '#/components/parameters/Entity'
      - name: warehouse_guid
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: sku_guid
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Primary-DB balance snapshot with available, reserved and physical quantities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockBalance'
              example:
                warehouse_guid: 01990f5b-bbb9-7000-8000-000000000001
                sku_guid: 01990f5b-bbb9-7000-8000-000000000001
                status: SELLABLE
                physical_qty_base: '1'
                reserved_qty_base: '1'
                available_qty_base: '1'
                as_of: '2026-10-28T10:00:00Z'
        '403':
          $ref: '#/components/responses/Problem'
  /api/v1/inventory/adjustments:
    post:
      operationId: createStockAdjustment
      x-permission: inventory.adjustment.create
      parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdjustment'
            example:
              warehouse_guid: 01990f5b-bbb9-7000-8000-000000000001
              sku_guid: 01990f5b-bbb9-7000-8000-000000000001
              book_qty_base: '10'
              counted_qty_base: '9'
              business_date: '2026-10-28'
              reason: example
              evidence_guid: 01990f5b-bbb9-7000-8000-000000000001
      responses:
        '201':
          description: Draft adjustment requiring another approver.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Adjustment'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: DRAFT
                delta_qty_base: '1'
                version: 1
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/inventory/adjustments/{guid}/post:
    post:
      operationId: postStockAdjustment
      x-permission: inventory.adjustment.approve
      parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/Guid'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
            example:
              reason: example
      responses:
        '200':
          description: Posted movement and balance update in one Operations transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Adjustment'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: POSTED
                delta_qty_base: '1'
                version: 1
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/warehouse/pick-tasks/{guid}/claim:
    post:
      operationId: claimPickTask
      x-permission: warehouse.pick
      parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/Guid'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Claimed task with lease expiry; one picker wins.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PickTask'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: IN_PROGRESS
                allocated_qty_base: '1'
                picked_qty_base: '1'
                version: 1
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
  /api/v1/warehouse/pick-tasks/{guid}/scans:
    post:
      operationId: scanPickLine
      x-permission: warehouse.pick
      parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/Guid'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PickScan'
            example:
              pick_line_guid: 01990f5b-bbb9-7000-8000-000000000001
              sku_guid: 01990f5b-bbb9-7000-8000-000000000001
              qty_base: '1'
              device_guid: 01990f5b-bbb9-7000-8000-000000000001
      responses:
        '200':
          description: Updated picked quantity and task version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PickTask'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: IN_PROGRESS
                allocated_qty_base: '1'
                picked_qty_base: '1'
                version: 1
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/warehouse/deliveries/{guid}/dispatch:
    post:
      operationId: dispatchDelivery
      x-permission: warehouse.dispatch
      parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/Guid'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchRequest'
            example:
              pick_task_guid: 01990f5b-bbb9-7000-8000-000000000001
              business_date: '2026-10-28'
              carrier_ref: PILOT-CARRIER-1
              packs:
              - pack_guid: 01990f5b-bbb9-7000-8000-000000000002
                lines:
                - source_portion_guid: 01990f5b-bbb9-7000-8000-000000000003
                  quantity_base: '5'
      responses:
        '202':
          description: Inventory movement requested; delivery is DISPATCHED only after owner acknowledgement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: DISPATCHED
                shipped_qty_base: '5'
                accepted_qty_base: '3'
                rejected_qty_base: '1'
                in_transit_qty_base: '1'
                version: 1
                lines:
                - guid: 01990f5b-bbb9-7000-8000-000000000003
                  shipped_qty_base: '5'
                  accepted_qty_base: '3'
                  rejected_qty_base: '1'
                  in_transit_qty_base: '1'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/warehouse/deliveries/{guid}/pod:
    post:
      operationId: acceptDeliveryPOD
      x-permission: warehouse.pod
      parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/Guid'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PodRequest'
            example:
              recipient_name: Pilot recipient
              evidence_guid: 01990f5b-bbb9-7000-8000-000000000001
              evidence_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
              lines:
              - delivery_line_guid: 01990f5b-bbb9-7000-8000-000000000001
                accepted_qty_base: '3'
                rejected_qty_base: '1'
      responses:
        '202':
          description: Evidence accepted and Finance posting pending; no DELIVERED status until Finance
            ack.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delivery'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: POD_ACCEPTED_PENDING_FINANCE
                shipped_qty_base: '5'
                accepted_qty_base: '3'
                rejected_qty_base: '1'
                in_transit_qty_base: '1'
                version: 1
                lines:
                - guid: 01990f5b-bbb9-7000-8000-000000000003
                  shipped_qty_base: '5'
                  accepted_qty_base: '3'
                  rejected_qty_base: '1'
                  in_transit_qty_base: '1'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/inventory/reservations/{guid}/consume:
    post:
      operationId: consumeReservation
      x-owner: operations
      x-permission: inventory.reserve.consume
      summary: 'consumeReservation: PARTIALLY_CONSUMED'
      parameters:
      - $ref: '#/components/parameters/Entity'
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                source_portion_guid: &id001
                  type: string
                  format: uuid
                quantity_base:
                  type: string
                  pattern: ^-?\d{1,14}(\.\d{1,6})?$
                pick_task_guid: *id001
              required:
              - source_portion_guid
              - quantity_base
              - pick_task_guid
            example:
              source_portion_guid: 01990f5b-bbb9-7000-8000-000000000002
              quantity_base: '100.00'
              pick_task_guid: 01990f5b-bbb9-7000-8000-000000000002
      responses:
        '200':
          description: PARTIALLY_CONSUMED state committed by Operations; fetch aggregate for full detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: PARTIALLY_CONSUMED
                version: 2
                operation_guid: 01990f5b-bbb9-7000-8000-000000000002
          headers:
            ETag:
              schema:
                type: string
              example: '"2"'
        default:
          description: Error status is 400/401/403/404/409/412/422/429/503 as applicable; code is stable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: RESERVATION_INSUFFICIENT
                message: Request cannot be completed
                details: {}
                request_id: req-01990f5b
      x-error-codes:
      - RESERVATION_INSUFFICIENT
      - RESERVATION_EXPIRED
  /api/v1/inventory/reservations/{guid}/expire:
    post:
      operationId: expireReservation
      x-owner: operations
      x-permission: inventory.reserve.expire
      summary: 'expireReservation: EXPIRED'
      parameters:
      - $ref: '#/components/parameters/Entity'
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
              required:
              - reason
            example:
              reason: Approved for pilot
      responses:
        '200':
          description: EXPIRED state committed by Operations; fetch aggregate for full detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: EXPIRED
                version: 2
                operation_guid: 01990f5b-bbb9-7000-8000-000000000002
          headers:
            ETag:
              schema:
                type: string
              example: '"2"'
        default:
          description: Error status is 400/401/403/404/409/412/422/429/503 as applicable; code is stable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: RESERVATION_ALREADY_CONSUMED
                message: Request cannot be completed
                details: {}
                request_id: req-01990f5b
      x-error-codes:
      - RESERVATION_ALREADY_CONSUMED
  /api/v1/inventory/lots/{guid}:
    get:
      operationId: getInventoryLot
      x-owner: operations
      x-permission: inventory.stock.view
      summary: Lot status, expiry, SKU, warehouse and remaining quantity; scoped.
      parameters:
      - $ref: '#/components/parameters/Entity'
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Lot status, expiry, SKU, warehouse and remaining quantity; scoped.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LotRead'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000002
                sku_guid: 01990f5b-bbb9-7000-8000-000000000002
                warehouse_guid: 01990f5b-bbb9-7000-8000-000000000002
                lot_no: pilot-reference
                status: pilot-reference
                sellable_base: '100.00'
                held_base: '100.00'
                version: 1
        default:
          description: Error status is 400/401/403/404/409/412/422/429/503 as applicable; code is stable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: RESOURCE_NOT_FOUND
                message: Request cannot be completed
                details: {}
                request_id: req-01990f5b
      x-error-codes: []
  /api/v1/inventory/serials/{guid}:
    get:
      operationId: getInventorySerial
      x-owner: operations
      x-permission: inventory.stock.view
      summary: Current serial state and source movement reference; scoped.
      parameters:
      - $ref: '#/components/parameters/Entity'
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Current serial state and source movement reference; scoped.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SerialRead'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000002
                sku_guid: 01990f5b-bbb9-7000-8000-000000000002
                serial_no: pilot-reference
                status: pilot-reference
                last_movement_guid: 01990f5b-bbb9-7000-8000-000000000002
                version: 1
        default:
          description: Error status is 400/401/403/404/409/412/422/429/503 as applicable; code is stable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: RESOURCE_NOT_FOUND
                message: Request cannot be completed
                details: {}
                request_id: req-01990f5b
      x-error-codes: []
  /api/v1/inventory/adjustments/{guid}/reverse:
    post:
      operationId: reverseStockAdjustment
      x-owner: operations
      x-permission: inventory.adjustment.reverse
      summary: 'reverseStockAdjustment: REVERSED'
      parameters:
      - $ref: '#/components/parameters/Entity'
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
                evidence_guid:
                  type: string
                  format: uuid
              required:
              - reason
              - evidence_guid
            example:
              reason: Approved for pilot
              evidence_guid: 01990f5b-bbb9-7000-8000-000000000002
      responses:
        '200':
          description: REVERSED state committed by Operations; fetch aggregate for full detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: REVERSED
                version: 2
                operation_guid: 01990f5b-bbb9-7000-8000-000000000002
          headers:
            ETag:
              schema:
                type: string
              example: '"2"'
        default:
          description: Error status is 400/401/403/404/409/412/422/429/503 as applicable; code is stable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: ADJUSTMENT_DOWNSTREAM_CONSUMED
                message: Request cannot be completed
                details: {}
                request_id: req-01990f5b
      x-error-codes:
      - ADJUSTMENT_DOWNSTREAM_CONSUMED
      - INVENTORY_PERIOD_CLOSED
  /api/v1/warehouse/pick-tasks/{guid}/complete:
    post:
      operationId: completePickTask
      x-owner: operations
      x-permission: warehouse.pick
      summary: 'completePickTask: PICKED'
      parameters:
      - $ref: '#/components/parameters/Entity'
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: false
                    required:
                    - source_portion_guid
                    - quantity_base
                    properties:
                      source_portion_guid:
                        type: string
                        format: uuid
                      quantity_base:
                        type: string
                        pattern: ^\d{1,14}(\.\d{1,6})?$
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
              required:
              - lines
              - reason
            example:
              lines:
              - source_portion_guid: 01990f5b-bbb9-7000-8000-000000000002
                quantity_base: '2'
              reason: Approved for pilot
      responses:
        '200':
          description: PICKED state committed by Operations; fetch aggregate for full detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: PICKED
                version: 2
                operation_guid: 01990f5b-bbb9-7000-8000-000000000002
          headers:
            ETag:
              schema:
                type: string
              example: '"2"'
        default:
          description: Error status is 400/401/403/404/409/412/422/429/503 as applicable; code is stable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: PICK_QTY_EXCEEDS_ALLOCATED
                message: Request cannot be completed
                details: {}
                request_id: req-01990f5b
      x-error-codes:
      - PICK_QTY_EXCEEDS_ALLOCATED
  /api/v1/warehouse/pick-tasks/{guid}/packs:
    post:
      operationId: completePack
      x-owner: operations
      x-permission: warehouse.pack
      summary: 'completePack: PACKED'
      parameters:
      - $ref: '#/components/parameters/Entity'
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: false
                    required:
                    - source_portion_guid
                    - quantity_base
                    properties:
                      source_portion_guid:
                        type: string
                        format: uuid
                      quantity_base:
                        type: string
                        pattern: ^\d{1,14}(\.\d{1,6})?$
                seal_ref:
                  type:
                  - string
                  - 'null'
                  maxLength: 500
              required:
              - lines
            example:
              lines:
              - source_portion_guid: 01990f5b-bbb9-7000-8000-000000000002
                quantity_base: '2'
      responses:
        '201':
          description: PACKED state committed by Operations; fetch aggregate for full detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: PACKED
                version: 2

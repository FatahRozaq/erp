openapi: 3.1.1
info:
  title: ERP Manufacturing Roadmap API
  version: 1.0.0
  description: Contract for bounded Enterprise Expansion owner operations.
servers:
- url: https://erp.example.invalid
security:
- bearerAuth: []
paths:
  /api/v1/boms:
    post:
      operationId: publishBom
      x-owner: operations
      x-stage: EXP
      x-permission: manufacturing.bom.publish
      x-error-codes: [BOM_EFFECTIVE_OVERLAP]
      summary: publishBom — PUBLISHED; authoritative owner state and idempotent retry.
      parameters:
      - name: X-Legal-Entity-Guid
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - finished_sku_guid
              - effective_from
              - yield_percent
              - components
              properties:
                finished_sku_guid:
                  type: string
                  format: uuid
                effective_from:
                  type: string
                  format: date
                yield_percent:
                  type: string
                  pattern: ^\d{1,14}(\.\d{1,6})?$
                components:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    additionalProperties: false
                    required:
                    - component_sku_guid
                    - qty_per_unit_base
                    properties:
                      component_sku_guid:
                        type: string
                        format: uuid
                      qty_per_unit_base:
                        type: string
                        pattern: ^\d{1,14}(\.\d{1,6})?$
            example:
              finished_sku_guid: 01990f5b-bbb9-7000-8000-000000000001
              effective_from: '2026-11-01'
              yield_percent: '100.000000'
              components:
              - component_sku_guid: 01990f5b-bbb9-7000-8000-000000000002
                qty_per_unit_base: '2.000000'
      responses:
        '201':
          description: Owner committed this state or persisted an explicit pending operation; inspect the resource
            before assuming downstream completion.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - guid
                - status
                - version
                - operation_guid
                properties:
                  guid:
                    type: string
                    format: uuid
                  status:
                    type: string
                  version:
                    type: integer
                    minimum: 1
                  operation_guid:
                    type: string
                    format: uuid
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: PUBLISHED
                version: 1
                operation_guid: 01990f5b-bbb9-7000-8000-000000000002
        default:
          description: Stable ERP error; 400/401/403/404/409/412/422/429/503 as applicable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: SOURCE_STATE_CONFLICT
                message: Request cannot be completed
                details: {}
                request_id: req-01990f5b
    get:
      x-owner: operations
      x-stage: EXP
      x-permission: manufacturing.bom.read
      summary: Read scoped Bom state; owner is authoritative.
      operationId: listBoms
      parameters:
      - name: X-Legal-Entity-Guid
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 25
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Scoped cursor page.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                - next_cursor
                - as_of
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                      - guid
                      - status
                      - version
                      - data
                      properties:
                        guid:
                          type: string
                          format: uuid
                        status:
                          type: string
                        version:
                          type: integer
                          minimum: 1
                        data:
                          type: object
                          additionalProperties: false
                          required:
                          - finished_sku_guid
                          - effective_from
                          - yield_percent
                          - components
                          properties:
                            finished_sku_guid:
                              type: string
                              format: uuid
                            effective_from:
                              type: string
                              format: date
                            yield_percent:
                              type: string
                              pattern: ^\d{1,14}(\.\d{1,6})?$
                            components:
                              type: array
                              minItems: 1
                              maxItems: 200
                              items:
                                type: object
                                additionalProperties: false
                                required:
                                - component_sku_guid
                                - qty_per_unit_base
                                properties:
                                  component_sku_guid:
                                    type: string
                                    format: uuid
                                  qty_per_unit_base:
                                    type: string
                                    pattern: ^\d{1,14}(\.\d{1,6})?$
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  as_of:
                    type: string
                    format: date-time
              example:
                items:
                - guid: 01990f5b-bbb9-7000-8000-000000000001
                  status: DRAFT
                  version: 1
                  data:
                    finished_sku_guid: 01990f5b-bbb9-7000-8000-000000000001
                    effective_from: '2026-11-01'
                    yield_percent: '100.000000'
                    components:
                    - component_sku_guid: 01990f5b-bbb9-7000-8000-000000000002
                      qty_per_unit_base: '2.000000'
                next_cursor: null
                as_of: '2026-11-01T10:00:00Z'
        default:
          description: Scoped 401/403/409/503 error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: SOURCE_STATE_CONFLICT
                message: Request cannot be completed
                details: {}
                request_id: req-01990f5b

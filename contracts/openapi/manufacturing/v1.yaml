components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required:
      - success
      - code
      - message
      - details
      - request_id
      properties:
        success:
          const: false
        code:
          type: string
        message:
          type: string
        details:
          type: object
        request_id:
          type: string

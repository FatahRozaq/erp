openapi: 3.1.1
info:
  title: ERP Sales Order and Credit API
  version: 1.0.0
  description: MVP sales commitment. Server owns price/tax/credit calculations; reservation is asynchronous
    after approval.
servers:
- url: https://erp.example.invalid
security:
- bearerAuth: []
paths:
  /api/v1/sales-orders:
    post:
      operationId: createSalesOrder
      x-permission: sales.order.create
      parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrder'
            example:
              customer_account_guid: 01990f5b-bbb9-7000-8000-000000000001
              branch_guid: 01990f5b-bbb9-7000-8000-000000000002
              business_date: '2026-10-28'
              currency: IDR
              lines:
              - sku_guid: 01990f5b-bbb9-7000-8000-000000000003
                warehouse_guid: 01990f5b-bbb9-7000-8000-000000000004
                qty_base: '24'
                manual_discount_percent: '0.000000'
                entered_qty: '2'
                entered_uom_guid: 01990f5b-bbb9-7000-8000-000000000002
                conversion_version_guid: 01990f5b-bbb9-7000-8000-000000000003
      responses:
        '201':
          description: Draft with server-computed quote and snapshot references.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                legal_entity_guid: 01990f5b-bbb9-7000-8000-000000000001
                customer_account_guid: 01990f5b-bbb9-7000-8000-000000000001
                status: DRAFT
                currency: IDR
                gross_total: '666'
                lines:
                - guid: 01990f5b-bbb9-7000-8000-000000000001
                  sku_guid: 01990f5b-bbb9-7000-8000-000000000001
                  qty_base: '24'
                  net: '600'
                  tax: '66'
                  gross: '666'
                  warehouse_guid: 01990f5b-bbb9-7000-8000-000000000002
                  entered_qty: '2'
                  entered_uom_guid: 01990f5b-bbb9-7000-8000-000000000002
                  conversion_version_guid: 01990f5b-bbb9-7000-8000-000000000003
                version: 1
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/sales-orders/{guid}:
    get:
      operationId: getSalesOrder
      x-permission: sales.order.read
      parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/Guid'
      responses:
        '200':
          description: Order and current asynchronous reservation/fulfillment state.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                legal_entity_guid: 01990f5b-bbb9-7000-8000-000000000001
                customer_account_guid: 01990f5b-bbb9-7000-8000-000000000001
                status: DRAFT
                currency: IDR
                gross_total: '666'
                lines:
                - guid: 01990f5b-bbb9-7000-8000-000000000001
                  sku_guid: 01990f5b-bbb9-7000-8000-000000000001
                  qty_base: '24'
                  net: '600'
                  tax: '66'
                  gross: '666'
                  warehouse_guid: 01990f5b-bbb9-7000-8000-000000000002
                  entered_qty: '2'
                  entered_uom_guid: 01990f5b-bbb9-7000-8000-000000000002
                  conversion_version_guid: 01990f5b-bbb9-7000-8000-000000000003
                version: 1
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/sales-orders/{guid}/submit:
    post:
      operationId: submitSalesOrder
      x-permission: sales.order.submit
      parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/Guid'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Credit/approval saga created; not yet allocatable.
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                legal_entity_guid: 01990f5b-bbb9-7000-8000-000000000001
                customer_account_guid: 01990f5b-bbb9-7000-8000-000000000001
                status: WAITING_APPROVAL
                currency: IDR
                gross_total: '666'
                lines:
                - guid: 01990f5b-bbb9-7000-8000-000000000001
                  sku_guid: 01990f5b-bbb9-7000-8000-000000000001
                  qty_base: '24'
                  net: '600'
                  tax: '66'
                  gross: '666'
                  warehouse_guid: 01990f5b-bbb9-7000-8000-000000000002
                  entered_qty: '2'
                  entered_uom_guid: 01990f5b-bbb9-7000-8000-000000000002
                  conversion_version_guid: 01990f5b-bbb9-7000-8000-000000000003
                version: 1
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/sales-orders/{guid}/approve:
    post:
      operationId: approveSalesOrder
      x-permission: sales.order.approve
      description: Policy decision is stored by Platform; Sales applies the acknowledgement and requests
        reservation.
      parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/Guid'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
            example:
              reason: example
      responses:
        '202':
          description: Approval accepted; reservation outcome pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                legal_entity_guid: 01990f5b-bbb9-7000-8000-000000000001
                customer_account_guid: 01990f5b-bbb9-7000-8000-000000000001
                status: APPROVED_PENDING_RESERVATION
                currency: IDR
                gross_total: '666'
                lines:
                - guid: 01990f5b-bbb9-7000-8000-000000000001
                  sku_guid: 01990f5b-bbb9-7000-8000-000000000001
                  qty_base: '24'
                  net: '600'
                  tax: '66'
                  gross: '666'
                  warehouse_guid: 01990f5b-bbb9-7000-8000-000000000002
                  entered_qty: '2'
                  entered_uom_guid: 01990f5b-bbb9-7000-8000-000000000002
                  conversion_version_guid: 01990f5b-bbb9-7000-8000-000000000003
                version: 1
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/sales-orders/{guid}/cancel:
    post:
      operationId: cancelSalesOrder
      x-permission: sales.order.cancel
      description: Allowed only before dispatch; reservation and credit release are idempotent saga steps.
      parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/Guid'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
            example:
              reason: example
      responses:
        '202':
          description: Cancellation and release pending owner acknowledgements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                legal_entity_guid: 01990f5b-bbb9-7000-8000-000000000001
                customer_account_guid: 01990f5b-bbb9-7000-8000-000000000001
                status: CANCELLED
                currency: IDR
                gross_total: '666'
                lines:
                - guid: 01990f5b-bbb9-7000-8000-000000000001
                  sku_guid: 01990f5b-bbb9-7000-8000-000000000001
                  qty_base: '24'
                  net: '600'
                  tax: '66'
                  gross: '666'
                  warehouse_guid: 01990f5b-bbb9-7000-8000-000000000002
                  entered_qty: '2'
                  entered_uom_guid: 01990f5b-bbb9-7000-8000-000000000002
                  conversion_version_guid: 01990f5b-bbb9-7000-8000-000000000003
                version: 1
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/credit/accounts/{guid}/exposure:
    get:
      operationId: getCreditExposure
      x-permission: credit.account.read
      parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/Guid'
      responses:
        '200':
          description: Authoritative current exposure from Commercial primary DB; not an approval promise.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exposure'
              example:
                account_guid: 01990f5b-bbb9-7000-8000-000000000001
                limit_base: '1'
                gross_exposure_base: '1'
                eligible_deposit_base: '1'
                net_exposure_base: '1'
                available_base: '1'
                currency: IDR
                as_of: '2026-10-28T10:00:00Z'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/sales-orders/{guid}/revisions:
    post:
      operationId: reviseSalesOrder
      x-owner: commercial
      x-permission: sales.order.revise
      summary: 'reviseSalesOrder: PENDING_RELEASE'
      parameters:
      - $ref: '#/components/parameters/Entity'
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: false
                    required:
                    - source_line_guid
                    - quantity_base
                    properties:
                      source_line_guid:
                        type: string
                        format: uuid
                      quantity_base:
                        type: string
                        pattern: ^\d{1,14}(\.\d{1,6})?$
                      unit_price:
                        type: string
                        pattern: ^\d{1,14}(\.\d{1,6})?$
              required:
              - reason
              - lines
            example:
              reason: Approved for pilot
              lines:
              - source_line_guid: 01990f5b-bbb9-7000-8000-000000000002
                quantity_base: '2'
      responses:
        '201':
          description: PENDING_RELEASE state committed by Commercial; fetch aggregate for full detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: PENDING_RELEASE
                version: 2
                operation_guid: 01990f5b-bbb9-7000-8000-000000000002
          headers:
            ETag:
              schema:
                type: string
              example: '"2"'
        default:
          description: Error status is 400/401/403/404/409/412/422/429/503 as applicable; code is stable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: SALES_ALREADY_SHIPPED
                message: Request cannot be completed
                details: {}
                request_id: req-01990f5b
      x-error-codes:
      - SALES_ALREADY_SHIPPED
      - SALES_REVISION_PENDING
  /api/v1/credit/accounts/{guid}/overrides:
    post:
      operationId: requestCreditOverride
      x-owner: commercial
      x-permission: credit.override.request
      summary: 'requestCreditOverride: PENDING_APPROVAL'
      parameters:
      - $ref: '#/components/parameters/Entity'
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                sales_order_guid:
                  type: string
                  format: uuid
                sales_order_revision:
                  type: integer
                  minimum: 0
                max_extra_base:
                  type: string
                  pattern: ^-?\d{1,14}(\.\d{1,6})?$
                expires_at:
                  type: string
                  format: date-time
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
              required:
              - sales_order_guid
              - sales_order_revision
              - max_extra_base
              - expires_at
              - reason
            example:
              sales_order_guid: 01990f5b-bbb9-7000-8000-000000000002
              sales_order_revision: 1
              max_extra_base: '100.00'
              expires_at: '2026-10-28T10:00:00Z'
              reason: Approved for pilot
      responses:
        '201':
          description: PENDING_APPROVAL state committed by Commercial; fetch aggregate for full detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: PENDING_APPROVAL
                version: 2
                operation_guid: 01990f5b-bbb9-7000-8000-000000000002
          headers:
            ETag:
              schema:
                type: string
              example: '"2"'
        default:
          description: Error status is 400/401/403/404/409/412/422/429/503 as applicable; code is stable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: CREDIT_OVERRIDE_DISABLED
                message: Request cannot be completed
                details: {}
                request_id: req-01990f5b
      x-error-codes:
      - CREDIT_OVERRIDE_DISABLED
      - CREDIT_OVERRIDE_DUPLICATE
  /api/v1/credit/overrides/{guid}/approve:
    post:
      operationId: approveCreditOverride
      x-owner: commercial
      x-permission: credit.override.approve
      summary: 'approveCreditOverride: APPROVED'
      parameters:
      - $ref: '#/components/parameters/Entity'
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
              required:
              - reason
            example:
              reason: Approved for pilot
      responses:
        '200':
          description: APPROVED state committed by Commercial; fetch aggregate for full detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: APPROVED
                version: 2
                operation_guid: 01990f5b-bbb9-7000-8000-000000000002
          headers:
            ETag:
              schema:
                type: string
              example: '"2"'
        default:
          description: Error status is 400/401/403/404/409/412/422/429/503 as applicable; code is stable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: APPROVAL_SOD_VIOLATION
                message: Request cannot be completed
                details: {}
                request_id: req-01990f5b
      x-error-codes:
      - APPROVAL_SOD_VIOLATION
      - CREDIT_OVERRIDE_EXPIRED
  /api/v1/credit/accounts/{guid}/reversal-holds:
    post:
      operationId: holdCreditForPaymentReversal
      x-owner: commercial
      x-permission: credit.reversal_hold.create
      parameters:
      - $ref: '#/components/parameters/Entity'
      - name: guid
        in: path
        required: true
        schema: &id001
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Owner state is authoritative; retry same operation key is idempotent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReversalHold'
              example: &id002
                guid: 01990f5b-bbb9-7000-8000-000000000003
                credit_account_guid: 01990f5b-bbb9-7000-8000-000000000001
                original_payment_guid: 01990f5b-bbb9-7000-8000-000000000002
                status: ACTIVE
                version: 1
        default:
          description: 401/403/404/409/422/503 as applicable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: SOURCE_STATE_CONFLICT
                message: Source state changed
                details: {}
                request_id: req-01990f5b
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReversalHoldRequest'
            example:
              original_payment_guid: 01990f5b-bbb9-7000-8000-000000000002
              reversal_operation_guid: 01990f5b-bbb9-7000-8000-000000000003
              reason: Payment reversal pending
  /api/v1/credit/accounts/{guid}/reversal-holds/{hold_guid}:
    get:
      operationId: getCreditReversalHold
      x-owner: commercial
      x-permission: credit.reversal_hold.read
      parameters:
      - $ref: '#/components/parameters/Entity'
      - name: guid
        in: path
        required: true
        schema: *id001
      - name: hold_guid
        in: path
        required: true
        schema: *id001
      responses:
        '200':
          description: Owner state is authoritative; retry same operation key is idempotent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReversalHold'
              example: *id002
        default:
          description: 401/403/404/409/422/503 as applicable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: SOURCE_STATE_CONFLICT
                message: Source state changed
                details: {}
                request_id: req-01990f5b
  /api/v1/credit/accounts/{guid}/reversal-holds/{hold_guid}/release:
    post:
      operationId: releaseCreditReversalHold
      x-owner: commercial
      x-permission: credit.reversal_hold.release
      description: Service-only. Applied path requires the matching reversal event in Credit inbox and an updated exposure projection. Absent path requires a fresh authoritative Finance status check; caller assertion alone never releases the hold.
      parameters:
      - $ref: '#/components/parameters/Entity'
      - name: guid
        in: path
        required: true
        schema: *id001
      - name: hold_guid
        in: path
        required: true
        schema: *id001
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Owner state is authoritative; retry same operation key is idempotent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReversalHold'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000003
                credit_account_guid: 01990f5b-bbb9-7000-8000-000000000001
                original_payment_guid: 01990f5b-bbb9-7000-8000-000000000002
                status: RELEASED
                version: 2
        default:
          description: 401/403/404/409/422/503 as applicable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: SOURCE_STATE_CONFLICT
                message: Source state changed
                details: {}
                request_id: req-01990f5b
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseHoldRequest'
            example:
              reason: Finance reversal applied to credit projection
              outcome: REVERSAL_APPLIED
              finance_reversal_guid: 01990f5b-bbb9-7000-8000-000000000004
  /api/v1/route-plans:
    post:
      operationId: createRoutePlan
      x-owner: commercial
      x-stage: P2
      x-permission: mobile.route.create
      summary: createRoutePlan — DRAFT; authoritative owner state and idempotent retry.
      parameters:
      - name: X-Legal-Entity-Guid
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - salesperson_guid
              - route_date
              - customer_account_guids
              properties:
                salesperson_guid:
                  type: string
                  format: uuid
                route_date:
                  type: string
                  format: date
                customer_account_guids:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: string
                    format: uuid
            example:
              salesperson_guid: 01990f5b-bbb9-7000-8000-000000000001
              route_date: '2026-11-01'
              customer_account_guids:
              - 01990f5b-bbb9-7000-8000-000000000002
      responses:
        '201':
          description: Owner committed this state or persisted an explicit pending operation; inspect the resource
            before assuming downstream completion.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - guid
                - status
                - version
                - operation_guid
                properties:
                  guid:
                    type: string
                    format: uuid
                  status:
                    type: string
                  version:
                    type: integer
                    minimum: 1
                  operation_guid:
                    type: string
                    format: uuid
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: DRAFT
                version: 1
                operation_guid: 01990f5b-bbb9-7000-8000-000000000002
        default:
          description: Stable ERP error; 400/401/403/404/409/412/422/429/503 as applicable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: SOURCE_STATE_CONFLICT
                message: Request cannot be completed
                details: {}
                request_id: req-01990f5b
    get:
      x-owner: commercial
      x-stage: P2
      x-permission: mobile.route.read
      summary: Read scoped RoutePlan state; owner is authoritative.
      operationId: listRoutePlans
      parameters:
      - name: X-Legal-Entity-Guid
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 25
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Scoped cursor page.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                - next_cursor
                - as_of
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                      - guid
                      - status
                      - version
                      - data
                      properties:
                        guid:
                          type: string
                          format: uuid
                        status:
                          type: string
                        version:
                          type: integer
                          minimum: 1
                        data:

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Entity:
      name: X-Legal-Entity-Guid
      in: header
      required: true
      schema:
        type: string
        format: uuid
    Guid:
      name: guid
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
  responses:
    Problem:
      description: Stable business error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            success: false
            code: CREDIT_LIMIT_EXCEEDED
            message: Credit hold
            details: {}
            request_id: req-01990f5b
  schemas:
    Decimal:
      type: string
      pattern: ^\d{1,14}(\.\d{1,6})?$
    SignedDecimal:
      type: string
      pattern: ^-?\d{1,14}(\.\d{1,6})?$
    Percent:
      type: string
      pattern: ^\d{1,2}(\.\d{1,6})?$
    CreateOrder:
      type: object
      additionalProperties: false
      required:
      - customer_account_guid
      - branch_guid
      - business_date
      - currency
      - lines
      properties:
        customer_account_guid:
          type: string
          format: uuid
        branch_guid:
          type: string
          format: uuid
        business_date:
          type: string
          format: date
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required:
            - sku_guid
            - warehouse_guid
            - qty_base
            - manual_discount_percent
            - entered_qty
            - entered_uom_guid
            properties:
              sku_guid:
                type: string
                format: uuid
              warehouse_guid:
                type: string
                format: uuid
              qty_base:
                $ref: '#/components/schemas/Decimal'
              manual_discount_percent:
                $ref: '#/components/schemas/Percent'
              entered_qty: &id004
                type: string
                pattern: ^\d{1,14}(\.\d{1,6})?$
              entered_uom_guid: &id003
                type: string
                format: uuid
              conversion_version_guid:
                type:
                - string
                - 'null'
                format: uuid
    Reason:
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
    Order:
      type: object
      additionalProperties: false
      required:
      - guid
      - legal_entity_guid
      - customer_account_guid
      - status
      - currency
      - gross_total
      - lines
      - version
      properties:
        guid:
          type: string
          format: uuid
        legal_entity_guid:
          type: string
          format: uuid
        customer_account_guid:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - DRAFT
          - SUBMITTED
          - WAITING_APPROVAL
          - APPROVED_PENDING_RESERVATION
          - ALLOCATABLE
          - BACKORDERED
          - PARTIALLY_FULFILLED
          - FULFILLED
          - CANCELLED
          - EXCEPTION
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        gross_total:
          $ref: '#/components/schemas/Decimal'
        pending_owner:
          type:
          - string
          - 'null'
          enum:
          - PLATFORM
          - COMMERCIAL
          - OPERATIONS
          - FINANCE
          - null
        lines:
          type: array
          items:
            type: object
            required:
            - guid
            - sku_guid
            - qty_base
            - net
            - tax
            - gross
            - warehouse_guid
            - entered_qty
            - entered_uom_guid
            - conversion_version_guid
            properties:
              guid:
                type: string
                format: uuid
              sku_guid:
                type: string
                format: uuid
              qty_base:
                $ref: '#/components/schemas/Decimal'
              net:
                $ref: '#/components/schemas/Decimal'
              tax:
                $ref: '#/components/schemas/Decimal'
              gross:
                $ref: '#/components/schemas/Decimal'
              warehouse_guid: *id003
              entered_qty: *id004
              entered_uom_guid: *id003
              conversion_version_guid:
                type:
                - string
                - 'null'
                format: uuid
        version:
          type: integer
          minimum: 1
    Exposure:
      type: object
      additionalProperties: false
      required:
      - account_guid
      - limit_base
      - gross_exposure_base
      - eligible_deposit_base
      - net_exposure_base
      - available_base
      - currency
      - as_of
      properties:
        account_guid:
          type: string
          format: uuid
        limit_base:
          $ref: '#/components/schemas/Decimal'
        gross_exposure_base:
          $ref: '#/components/schemas/Decimal'
        eligible_deposit_base:
          $ref: '#/components/schemas/Decimal'
        net_exposure_base:
          $ref: '#/components/schemas/Decimal'
        available_base:
          $ref: '#/components/schemas/SignedDecimal'
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        as_of:
          type: string
          format: date-time
    Problem:
      type: object
      additionalProperties: false
      required:
      - success
      - code
      - message
      - details
      - request_id
      properties:
        success:
          type: boolean
          const: false
        code:
          type: string
        message:
          type: string
        details:
          type: object
        request_id:
          type: string
    CommandReceipt:
      type: object
      additionalProperties: false
      required:
      - guid
      - status
      - version
      - operation_guid
      properties:
        guid: &id005
          type: string
          format: uuid
        status:
          type: string
        version:
          type: integer
          minimum: 1
        operation_guid: *id005
    ReversalHoldRequest:
      type: object
      additionalProperties: false
      required:
      - original_payment_guid
      - reversal_operation_guid
      - reason
      properties:
        original_payment_guid: *id001
        reversal_operation_guid: *id001
        reason:
          type: string
          minLength: 3
    ReversalHold:
      type: object
      additionalProperties: false
      required:
      - guid
      - credit_account_guid
      - original_payment_guid
      - status
      - version
      properties:
        guid: *id001
        credit_account_guid: *id001
        original_payment_guid: *id001
        status:
          type: string
          enum:
          - ACTIVE
          - RELEASED
        version:
          type: integer
          minimum: 1
    ReleaseHoldRequest:
      type: object
      additionalProperties: false
      required:
      - reason
      - outcome
      properties:
        reason:
          type: string
          minLength: 3
        outcome:
          type: string
          enum:
          - REVERSAL_APPLIED
          - REVERSAL_ABSENT
        finance_reversal_guid: *id001
        finance_reversal_absent:
          const: true
      oneOf:
      - properties:
          outcome:
            const: REVERSAL_APPLIED
        required:
        - finance_reversal_guid
        not:
          required:
          - finance_reversal_absent
      - properties:
          outcome:
            const: REVERSAL_ABSENT
        required:
        - finance_reversal_absent
        not:
          required:
          - finance_reversal_guid

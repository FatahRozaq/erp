openapi: 3.1.1
info:
  title: ERP Sales Return API
  version: 1.0.0
  description: Phase 2 RMA orchestration. Physical inspection and finance posting are separate owner commits.
servers:
- url: https://erp.example.invalid
security:
- bearerAuth: []
paths:
  /api/v1/sales-returns:
    post:
      operationId: createSalesReturn
      x-permission: sales.return.create
      parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReturn'
            example:
              delivery_guid: 01990f5b-bbb9-7000-8000-000000000021
              reason_code: CUSTOMER_REJECTED
              lines:
              - delivery_line_guid: 01990f5b-bbb9-7000-8000-000000000022
                source_portion_guid: 01990f5b-bbb9-7000-8000-000000000023
                requested_qty_base: '3.000000'
      responses:
        '201':
          description: Draft RMA
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Return'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                legal_entity_guid: 01990f5b-bbb9-7000-8000-000000000001
                delivery_guid: 01990f5b-bbb9-7000-8000-000000000001
                status: DRAFT
                lines:
                - guid: 01990f5b-bbb9-7000-8000-000000000001
                  source_portion_guid: 01990f5b-bbb9-7000-8000-000000000001
                  requested_qty_base: '1'
                  approved_qty_base: '1'
                  received_qty_base: '1'
                  accepted_qty_base: '1'
                  rejected_qty_base: '1'
                version: 1
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/sales-returns/{guid}:
    get:
      operationId: getSalesReturn
      x-permission: sales.return.read
      parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/Guid'
      responses:
        '200':
          description: RMA state and downstream posting reference
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Return'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                legal_entity_guid: 01990f5b-bbb9-7000-8000-000000000001
                delivery_guid: 01990f5b-bbb9-7000-8000-000000000001
                status: DRAFT
                lines:
                - guid: 01990f5b-bbb9-7000-8000-000000000001
                  source_portion_guid: 01990f5b-bbb9-7000-8000-000000000001
                  requested_qty_base: '1'
                  approved_qty_base: '1'
                  received_qty_base: '1'
                  accepted_qty_base: '1'
                  rejected_qty_base: '1'
                version: 1
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/sales-returns/{guid}/submit:
    post:
      operationId: submitSalesReturn
      x-permission: sales.return.submit
      parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/Guid'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Pending approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Return'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                legal_entity_guid: 01990f5b-bbb9-7000-8000-000000000001
                delivery_guid: 01990f5b-bbb9-7000-8000-000000000001
                status: DRAFT
                lines:
                - guid: 01990f5b-bbb9-7000-8000-000000000001
                  source_portion_guid: 01990f5b-bbb9-7000-8000-000000000001
                  requested_qty_base: '1'
                  approved_qty_base: '1'
                  received_qty_base: '1'
                  accepted_qty_base: '1'
                  rejected_qty_base: '1'
                version: 1
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/sales-returns/{guid}/approve:
    post:
      operationId: approveSalesReturn
      x-permission: sales.return.approve
      parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/Guid'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reason'
            example:
              reason: example
      responses:
        '200':
          description: Approved for inspection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Return'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                legal_entity_guid: 01990f5b-bbb9-7000-8000-000000000001
                delivery_guid: 01990f5b-bbb9-7000-8000-000000000001
                status: DRAFT
                lines:
                - guid: 01990f5b-bbb9-7000-8000-000000000001
                  source_portion_guid: 01990f5b-bbb9-7000-8000-000000000001
                  requested_qty_base: '1'
                  approved_qty_base: '1'
                  received_qty_base: '1'
                  accepted_qty_base: '1'
                  rejected_qty_base: '1'
                version: 1
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
  /api/v1/sales-returns/{guid}/inspect:
    post:
      operationId: inspectSalesReturn
      x-permission: inventory.return.inspect
      description: Sales checks the RMA ETag and creates an operation; Operations commits one inspection
        batch against its cumulative approved-quantity limits. Poll the Location URL for the result. Further
        batches may follow until every approved unit is classified.
      parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/Guid'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Inspection'
            example:
              warehouse_guid: 01990f5b-bbb9-7000-8000-000000000001
              lines:
              - return_line_guid: 01990f5b-bbb9-7000-8000-000000000001
                accepted_qty_base: '1'
                rejected_qty_base: '1'
                disposition: SELLABLE
      responses:
        '202':
          description: Inspection queued for Operations; RMA projection updates after the Operations commit.
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: PENDING
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/sales-returns/{guid}/post:
    post:
      operationId: postSalesReturn
      x-permission: finance.return.post
      description: Allowed after every approved unit is accepted or rejected and the Sales projection
        has caught up. Finance locks source portions and posts the accepted quantity once; Sales becomes
        POSTED only after the Finance acknowledgement.
      parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/Guid'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Finance posting requested; return is not POSTED until ack.
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: PENDING
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/return-operations/{guid}:
    get:
      operationId: getReturnOperation
      x-permission: sales.return.read
      parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/Guid'
      responses:
        '200':
          description: Async operation state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: PENDING
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/purchase-returns:
    post:
      operationId: createPurchaseReturn
      x-owner: commercial
      x-stage: P2
      x-permission: purchase.return.create
      x-error-codes: [PURCHASE_RETURN_EXCEEDS_SOURCE]
      summary: createPurchaseReturn — DRAFT; authoritative owner state and idempotent retry.
      parameters:
      - name: X-Legal-Entity-Guid
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - goods_receipt_guid
              - reason_code
              - lines
              properties:
                goods_receipt_guid:
                  type: string
                  format: uuid
                reason_code:
                  type: string
                  minLength: 1
                  maxLength: 500
                lines:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    additionalProperties: false
                    required:
                    - goods_receipt_line_guid
                    - requested_qty_base
                    properties:
                      goods_receipt_line_guid:
                        type: string
                        format: uuid
                      requested_qty_base:
                        type: string
                        pattern: ^\d{1,14}(\.\d{1,6})?$
            example:
              goods_receipt_guid: 01990f5b-bbb9-7000-8000-000000000001
              reason_code: DAMAGED
              lines:
              - goods_receipt_line_guid: 01990f5b-bbb9-7000-8000-000000000002
                requested_qty_base: '3.000000'
      responses:
        '201':
          description: Owner committed this state or persisted an explicit pending operation; inspect the resource
            before assuming downstream completion.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - guid
                - status
                - version
                - operation_guid
                properties:
                  guid:
                    type: string
                    format: uuid
                  status:
                    type: string
                  version:
                    type: integer
                    minimum: 1
                  operation_guid:
                    type: string
                    format: uuid
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: DRAFT
                version: 1
                operation_guid: 01990f5b-bbb9-7000-8000-000000000002
        default:
          description: Stable ERP error; 400/401/403/404/409/412/422/429/503 as applicable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: SOURCE_STATE_CONFLICT
                message: Request cannot be completed
                details: {}
                request_id: req-01990f5b
    get:
      x-owner: commercial
      x-stage: P2
      x-permission: purchase.return.read
      summary: Read scoped PurchaseReturn state; owner is authoritative.
      operationId: listPurchaseReturns
      parameters:
      - name: X-Legal-Entity-Guid
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 25
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Scoped cursor page.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                - next_cursor
                - as_of
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                      - guid
                      - status
                      - version
                      - data
                      properties:
                        guid:
                          type: string
                          format: uuid
                        status:
                          type: string
                        version:
                          type: integer
                          minimum: 1
                        data:
                          type: object
                          additionalProperties: false
                          required:
                          - goods_receipt_guid
                          - reason_code
                          - lines
                          properties:
                            goods_receipt_guid:
                              type: string
                              format: uuid
                            reason_code:
                              type: string
                              minLength: 1
                              maxLength: 500
                            lines:
                              type: array
                              minItems: 1
                              maxItems: 200
                              items:
                                type: object
                                additionalProperties: false
                                required:
                                - goods_receipt_line_guid
                                - requested_qty_base
                                properties:
                                  goods_receipt_line_guid:
                                    type: string
                                    format: uuid
                                  requested_qty_base:
                                    type: string
                                    pattern: ^\d{1,14}(\.\d{1,6})?$
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  as_of:
                    type: string
                    format: date-time
              example:
                items:
                - guid: 01990f5b-bbb9-7000-8000-000000000001
                  status: DRAFT
                  version: 1
                  data:
                    goods_receipt_guid: 01990f5b-bbb9-7000-8000-000000000001
                    reason_code: DAMAGED
                    lines:
                    - goods_receipt_line_guid: 01990f5b-bbb9-7000-8000-000000000002
                      requested_qty_base: '3.000000'
                next_cursor: null
                as_of: '2026-11-01T10:00:00Z'
        default:
          description: Scoped 401/403/409/503 error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: SOURCE_STATE_CONFLICT
                message: Request cannot be completed
                details: {}
                request_id: req-01990f5b
  /api/v1/purchase-returns/{guid}/inspect:
    post:
      operationId: inspectPurchaseReturn
      x-owner: commercial
      x-stage: P2
      x-permission: purchase.return.inspect
      x-error-codes: [PURCHASE_RETURN_EXCEEDS_SOURCE]
      summary: inspectPurchaseReturn — INSPECTED; authoritative owner state and idempotent retry.
      parameters:
      - name: X-Legal-Entity-Guid
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - evidence_guid
              - accepted_qty_base
              - disposition
              properties:
                evidence_guid:
                  type: string
                  format: uuid
                accepted_qty_base:
                  type: string
                  pattern: ^\d{1,14}(\.\d{1,6})?$
                disposition:
                  type: string
                  minLength: 1
                  maxLength: 500
            example:
              evidence_guid: 01990f5b-bbb9-7000-8000-000000000001
              accepted_qty_base: '3.000000'
              disposition: RETURN_TO_VENDOR
      responses:
        '200':
          description: Owner committed this state or persisted an explicit pending operation; inspect the resource
            before assuming downstream completion.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - guid
                - status
                - version
                - operation_guid
                properties:
                  guid:
                    type: string
                    format: uuid
                  status:
                    type: string
                  version:
                    type: integer
                    minimum: 1
                  operation_guid:
                    type: string
                    format: uuid
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: INSPECTED
                version: 2
                operation_guid: 01990f5b-bbb9-7000-8000-000000000002
        default:
          description: Stable ERP error; 400/401/403/404/409/412/422/429/503 as applicable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: SOURCE_STATE_CONFLICT
                message: Request cannot be completed
                details: {}
                request_id: req-01990f5b
  /api/v1/purchase-returns/{guid}/post:
    post:
      operationId: postPurchaseReturn
      x-owner: commercial
      x-stage: P2
      x-permission: purchase.return.post
      x-error-codes: [PURCHASE_RETURN_EXCEEDS_SOURCE]
      summary: postPurchaseReturn — POSTING_PENDING; authoritative owner state and idempotent retry.
      x-emits:
      - purchase.return.posted.v1
      x-emits-on-status: POSTED
      parameters:
      - name: X-Legal-Entity-Guid
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - business_date
              - reason
              properties:
                business_date:
                  type: string
                  format: date
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
            example:
              business_date: '2026-11-01'
              reason: Approved supplier return
      responses:
        '202':
          description: Owner committed this state or persisted an explicit pending operation; inspect the resource
            before assuming downstream completion.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - guid
                - status
                - version
                - operation_guid
                properties:
                  guid:
                    type: string
                    format: uuid
                  status:
                    type: string
                  version:
                    type: integer
                    minimum: 1
                  operation_guid:
                    type: string
                    format: uuid
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: POSTING_PENDING
                version: 2
                operation_guid: 01990f5b-bbb9-7000-8000-000000000002
        default:
          description: Stable ERP error; 400/401/403/404/409/412/422/429/503 as applicable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: SOURCE_STATE_CONFLICT
                message: Request cannot be completed
                details: {}
                request_id: req-01990f5b
  /api/v1/purchase-returns/{guid}:
    get:
      x-owner: commercial
      x-stage: P2
      x-permission: purchase.return.read
      summary: Read scoped PurchaseReturn state; owner is authoritative.
      operationId: getPurchaseReturn
      parameters:
      - name: X-Legal-Entity-Guid
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Current owner aggregate.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - guid
                - status
                - version
                - data
                properties:
                  guid:
                    type: string
                    format: uuid
                  status:
                    type: string
                  version:
                    type: integer
                    minimum: 1
                  data:
                    type: object
                    additionalProperties: false
                    required:
                    - goods_receipt_guid
                    - reason_code
                    - lines
                    properties:
                      goods_receipt_guid:
                        type: string
                        format: uuid
                      reason_code:
                        type: string
                        minLength: 1
                        maxLength: 500
                      lines:
                        type: array
                        minItems: 1
                        maxItems: 200
                        items:
                          type: object
                          additionalProperties: false
                          required:
                          - goods_receipt_line_guid
                          - requested_qty_base
                          properties:
                            goods_receipt_line_guid:
                              type: string
                              format: uuid
                            requested_qty_base:
                              type: string
                              pattern: ^\d{1,14}(\.\d{1,6})?$
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: DRAFT
                version: 1
                data:
                  goods_receipt_guid: 01990f5b-bbb9-7000-8000-000000000001
                  reason_code: DAMAGED
                  lines:
                  - goods_receipt_line_guid: 01990f5b-bbb9-7000-8000-000000000002
                    requested_qty_base: '3.000000'
        default:
          description: Scoped 401/403/404/503 error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: SOURCE_STATE_CONFLICT
                message: Request cannot be completed
                details: {}
                request_id: req-01990f5b
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Entity:
      name: X-Legal-Entity-Guid
      in: header
      required: true
      schema:
        type: string
        format: uuid
    Guid:
      name: guid
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
  responses:
    Problem:
      description: Stable domain error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            success: false
            code: RETURN_SOURCE_NOT_ELIGIBLE
            message: Source quantity is not eligible
            details: {}
            request_id: req-01990f5b
  schemas:
    Decimal:
      type: string
      pattern: ^\d{1,14}(\.\d{1,6})?$
    CreateReturn:
      type: object
      additionalProperties: false
      required:
      - delivery_guid
      - reason_code
      - lines
      properties:
        delivery_guid:
          type: string
          format: uuid
        reason_code:
          type: string
          minLength: 1
          maxLength: 64
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required:
            - delivery_line_guid
            - source_portion_guid
            - requested_qty_base
            properties:
              delivery_line_guid:
                type: string
                format: uuid
              source_portion_guid:
                type: string
                format: uuid
              requested_qty_base:
                $ref: '#/components/schemas/Decimal'
    Reason:
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    Inspection:
      type: object
      additionalProperties: false
      required:
      - warehouse_guid
      - lines
      properties:
        warehouse_guid:
          type: string
          format: uuid
        lines:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - return_line_guid
            - accepted_qty_base
            - rejected_qty_base
            - disposition
            properties:
              return_line_guid:
                type: string
                format: uuid
              accepted_qty_base:

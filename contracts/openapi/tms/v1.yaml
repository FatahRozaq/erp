openapi: 3.1.1
info:
  title: ERP Tms Roadmap API
  version: 1.0.0
  description: Contract for bounded Enterprise Expansion owner operations.
servers:
- url: https://erp.example.invalid
security:
- bearerAuth: []
paths:
  /api/v1/transport-plans:
    post:
      operationId: createTransportPlan
      x-owner: operations
      x-stage: EXP
      x-permission: tms.plan.create
      x-error-codes: [TMS_SOURCE_NOT_DISPATCHED]
      summary: createTransportPlan — DRAFT; authoritative owner state and idempotent retry.
      parameters:
      - name: X-Legal-Entity-Guid
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - carrier_guid
              - delivery_guids
              - eta
              properties:
                carrier_guid:
                  type: string
                  format: uuid
                delivery_guids:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: string
                    format: uuid
                eta:
                  type: string
                  format: date-time
            example:
              carrier_guid: 01990f5b-bbb9-7000-8000-000000000001
              delivery_guids:
              - 01990f5b-bbb9-7000-8000-000000000002
              eta: '2026-11-01T18:00:00Z'
      responses:
        '201':
          description: Owner committed this state or persisted an explicit pending operation; inspect the resource
            before assuming downstream completion.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - guid
                - status
                - version
                - operation_guid
                properties:
                  guid:
                    type: string
                    format: uuid
                  status:
                    type: string
                  version:
                    type: integer
                    minimum: 1
                  operation_guid:
                    type: string
                    format: uuid
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: DRAFT
                version: 1
                operation_guid: 01990f5b-bbb9-7000-8000-000000000002
        default:
          description: Stable ERP error; 400/401/403/404/409/412/422/429/503 as applicable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: SOURCE_STATE_CONFLICT
                message: Request cannot be completed
                details: {}
                request_id: req-01990f5b
    get:
      x-owner: operations
      x-stage: EXP
      x-permission: tms.plan.read
      summary: Read scoped TransportPlan state; owner is authoritative.
      operationId: listTransportPlans
      parameters:
      - name: X-Legal-Entity-Guid
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 25
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Scoped cursor page.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                - next_cursor
                - as_of
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                      - guid
                      - status
                      - version
                      - data
                      properties:
                        guid:
                          type: string
                          format: uuid
                        status:
                          type: string
                        version:
                          type: integer
                          minimum: 1
                        data:
                          type: object
                          additionalProperties: false
                          required:
                          - carrier_guid
                          - delivery_guids
                          - eta
                          properties:
                            carrier_guid:
                              type: string
                              format: uuid
                            delivery_guids:
                              type: array
                              minItems: 1
                              maxItems: 200
                              items:
                                type: string
                                format: uuid
                            eta:
                              type: string
                              format: date-time
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  as_of:
                    type: string
                    format: date-time
              example:
                items:
                - guid: 01990f5b-bbb9-7000-8000-000000000001
                  status: DRAFT
                  version: 1
                  data:
                    carrier_guid: 01990f5b-bbb9-7000-8000-000000000001
                    delivery_guids:
                    - 01990f5b-bbb9-7000-8000-000000000002
                    eta: '2026-11-01T18:00:00Z'
                next_cursor: null
                as_of: '2026-11-01T10:00:00Z'
        default:
          description: Scoped 401/403/409/503 error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: SOURCE_STATE_CONFLICT
                message: Request cannot be completed
                details: {}
                request_id: req-01990f5b
  /api/v1/transport-plans/{guid}/assign:
    post:
      operationId: assignTransportPlan
      x-owner: operations
      x-stage: EXP
      x-permission: tms.plan.assign
      x-error-codes: [TMS_SOURCE_NOT_DISPATCHED]
      summary: assignTransportPlan — ASSIGNED; authoritative owner state and idempotent retry.
      parameters:
      - name: X-Legal-Entity-Guid
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - driver_ref
              - vehicle_ref
              - reason
              properties:
                driver_ref:
                  type: string
                  minLength: 1
                  maxLength: 500
                vehicle_ref:
                  type: string
                  minLength: 1
                  maxLength: 500
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
            example:
              driver_ref: DRIVER-001
              vehicle_ref: VEHICLE-001
              reason: Carrier confirmed
      responses:
        '200':
          description: Owner committed this state or persisted an explicit pending operation; inspect the resource
            before assuming downstream completion.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - guid
                - status
                - version
                - operation_guid
                properties:
                  guid:
                    type: string
                    format: uuid
                  status:
                    type: string
                  version:
                    type: integer
                    minimum: 1
                  operation_guid:
                    type: string
                    format: uuid
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: ASSIGNED
                version: 2
                operation_guid: 01990f5b-bbb9-7000-8000-000000000002
        default:
          description: Stable ERP error; 400/401/403/404/409/412/422/429/503 as applicable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: SOURCE_STATE_CONFLICT
                message: Request cannot be completed
                details: {}
                request_id: req-01990f5b
  /api/v1/transport-plans/{guid}/milestones:
    post:
      operationId: recordTransportMilestone
      x-owner: operations
      x-stage: EXP
      x-permission: tms.milestone.record
      x-error-codes: [TMS_SOURCE_NOT_DISPATCHED]
      summary: recordTransportMilestone — RECORDED; authoritative owner state and idempotent retry.
      x-emits:
      - tms.milestone.recorded.v1
      parameters:
      - name: X-Legal-Entity-Guid
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - delivery_guid
              - type
              - occurred_at
              - provider_event_id
              properties:
                delivery_guid:
                  type: string
                  format: uuid
                type:
                  type: string
                  minLength: 1
                  maxLength: 500
                occurred_at:
                  type: string
                  format: date-time
                provider_event_id:
                  type: string
                  minLength: 1
                  maxLength: 500
            example:
              delivery_guid: 01990f5b-bbb9-7000-8000-000000000001
              type: ARRIVAL
              occurred_at: '2026-11-01T17:00:00Z'
              provider_event_id: evt-tms-001
      responses:
        '200':
          description: Owner committed this state or persisted an explicit pending operation; inspect the resource
            before assuming downstream completion.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - guid
                - status
                - version
                - operation_guid
                properties:
                  guid:
                    type: string
                    format: uuid
                  status:
                    type: string
                  version:
                    type: integer
                    minimum: 1
                  operation_guid:
                    type: string
                    format: uuid
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: RECORDED
                version: 2
                operation_guid: 01990f5b-bbb9-7000-8000-000000000002
        default:
          description: Stable ERP error; 400/401/403/404/409/412/422/429/503 as applicable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: SOURCE_STATE_CONFLICT
                message: Request cannot be completed
                details: {}
                request_id: req-01990f5b
  /api/v1/transport-plans/{guid}:
    get:
      x-owner: operations
      x-stage: EXP
      x-permission: tms.plan.read
      summary: Read scoped TransportPlan state; owner is authoritative.
      operationId: getTransportPlan
      parameters:
      - name: X-Legal-Entity-Guid
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Current owner aggregate.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - guid
                - status
                - version
                - data
                properties:
                  guid:
                    type: string
                    format: uuid
                  status:
                    type: string
                  version:
                    type: integer
                    minimum: 1
                  data:
                    type: object
                    additionalProperties: false
                    required:
                    - carrier_guid
                    - delivery_guids
                    - eta
                    properties:
                      carrier_guid:
                        type: string
                        format: uuid
                      delivery_guids:
                        type: array
                        minItems: 1
                        maxItems: 200
                        items:
                          type: string
                          format: uuid
                      eta:
                        type: string
                        format: date-time
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: DRAFT
                version: 1
                data:
                  carrier_guid: 01990f5b-bbb9-7000-8000-000000000001
                  delivery_guids:
                  - 01990f5b-bbb9-7000-8000-000000000002
                  eta: '2026-11-01T18:00:00Z'
        default:
          description: Scoped 401/403/404/503 error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: SOURCE_STATE_CONFLICT
                message: Request cannot be completed
                details: {}
                request_id: req-01990f5b
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required:
      - success
      - code
      - message
      - details
      - request_id
      properties:
        success:
          const: false
        code:
          type: string
        message:
          type: string
        details:
          type: object
        request_id:
          type: string

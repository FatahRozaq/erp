openapi: 3.1.1
info:
  title: ERP Platform Foundation API
  version: 1.0.0
  description: Organization, IAM, party accounts and policy activation for Foundation
    MVP.
servers:
- url: https://erp.example.invalid
security:
- bearerAuth: []
paths:
  /api/v1/org-nodes:
    post:
      operationId: createOrgNode
      x-permission: organization.manage
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrgNode'
            example:
              kind: BRANCH
              parent_guid: 01990f5b-bbb9-7000-8000-000000000001
              code: JKT01
              name: Jakarta 01
      responses:
        '201':
          description: Draft node; parent and scope are server validated.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgNode'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                kind: COMPANY
                parent_guid: 01990f5b-bbb9-7000-8000-000000000001
                code: PILOT-01
                name: Pilot example
                status: DRAFT
                version: 1
                scope_version: 1
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/org-nodes/{guid}/activate:
    post:
      operationId: activateOrgNode
      x-permission: organization.activate
      parameters:
      - $ref: '#/components/parameters/Guid'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionReason'
            example:
              reason: example
      responses:
        '200':
          description: Active node and new tenant scope version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgNode'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                kind: COMPANY
                parent_guid: 01990f5b-bbb9-7000-8000-000000000001
                code: PILOT-01
                name: Pilot example
                status: ACTIVE
                version: 1
                scope_version: 1
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/users/{guid}/role-grants:
    post:
      operationId: grantUserRole
      x-permission: iam.role.assign
      description: Grantor can only delegate a subset of their own effective permissions
        and scope; privileged grants require another checker.
      parameters:
      - $ref: '#/components/parameters/Guid'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleGrantRequest'
            example:
              role_guid: 01990f5b-bbb9-7000-8000-000000000001
              legal_entity_guid: 01990f5b-bbb9-7000-8000-000000000001
              effective_from: '2026-10-28T10:00:00Z'
              reason: example
      responses:
        '201':
          description: Grant and incremented session version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleGrant'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                user_guid: 01990f5b-bbb9-7000-8000-000000000001
                role_guid: 01990f5b-bbb9-7000-8000-000000000001
                legal_entity_guid: 01990f5b-bbb9-7000-8000-000000000001
                effective_from: '2026-10-28T10:00:00Z'
                version: 1
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    get:
      operationId: listUserRoleGrants
      x-owner: platform
      x-permission: iam.role.read
      summary: Effective and historical grants, scoped to administrative authority.
      parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: cursor
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
          maxLength: 500
      responses:
        '200':
          description: Effective and historical grants, scoped to administrative authority.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleGrantReadPage'
              example:
                items:
                - guid: 01990f5b-bbb9-7000-8000-000000000002
                  role_guid: 01990f5b-bbb9-7000-8000-000000000002
                  legal_entity_guid: 01990f5b-bbb9-7000-8000-000000000002
                  effective_from: '2026-10-28'
                  status: pilot-reference
                  version: 1
                next_cursor: null
                watermark: '2026-10-28T10:00:00Z'
        default:
          description: Error status is 400/401/403/404/409/412/422/429/503 as applicable;
            code is stable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: RESOURCE_NOT_FOUND
                message: Request cannot be completed
                details: {}
                request_id: req-01990f5b
      x-error-codes: []
  /api/v1/users/{guid}/suspend:
    post:
      operationId: suspendUser
      x-permission: iam.user.suspend
      parameters:
      - $ref: '#/components/parameters/Guid'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionReason'
            example:
              reason: example
      responses:
        '200':
          description: User suspended; old session version denied within 60 seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserState'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: SUSPENDED
                session_version: 1
                version: 1
        '403':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
  /api/v1/party-accounts:
    post:
      operationId: createPartyAccount
      x-permission: master.party.manage
      parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePartyAccount'
            example:
              party_type: CUSTOMER
              code: CUS-001
              name: Contoh Pelanggan
              currency: IDR
              payment_term_days: 30
      responses:
        '201':
          description: Draft entity-scoped account; sensitive fields are masked in
            response.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyAccount'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                party_guid: 01990f5b-bbb9-7000-8000-000000000001
                legal_entity_guid: 01990f5b-bbb9-7000-8000-000000000001
                party_type: CUSTOMER
                code: PILOT-01
                name: Pilot example
                status: DRAFT
                currency: IDR
                version: 1
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/party-accounts/{guid}/publish:
    post:
      operationId: publishPartyAccount
      x-permission: master.party.publish
      parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/Guid'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionReason'
            example:
              reason: example
      responses:
        '200':
          description: Published account snapshot for future transactions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyAccount'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                party_guid: 01990f5b-bbb9-7000-8000-000000000001
                legal_entity_guid: 01990f5b-bbb9-7000-8000-000000000001
                party_type: CUSTOMER
                code: PILOT-01
                name: Pilot example
                status: ACTIVE
                currency: IDR
                version: 1
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/policies/simulations:
    post:
      operationId: simulatePolicy
      x-permission: policy.simulate
      parameters:
      - $ref: '#/components/parameters/Entity'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicySimulation'
            example:
              policy_guid: 01990f5b-bbb9-7000-8000-000000000001
              policy_type: TAX
              business_date: '2026-10-28'
              fixture:
                party_account_guid: 01990f5b-bbb9-7000-8000-000000000001
                sku_guid: 01990f5b-bbb9-7000-8000-000000000001
                transaction_type: SALE
                taxable_net: '120000'
      responses:
        '200':
          description: Read-only matched rule and result; no policy activation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationResult'
              example:
                policy_guid: 01990f5b-bbb9-7000-8000-000000000001
                policy_type: TAX
                matched_rule_guid: 01990f5b-bbb9-7000-8000-000000000001
                result_hash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                outcome: PASS
                result:
                  dpp_base: '110000'
                  vat_base: '13200'
                  gross_base: '133200'
                  rule_guid: 01990f5b-bbb9-7000-8000-000000000001
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/policies/{guid}/activate:
    post:
      operationId: activatePolicy
      x-permission: policy.activate
      parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/Guid'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivatePolicy'
            example:
              effective_from: '2026-10-28'
              simulation_result_hash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
              reason: example
      responses:
        '200':
          description: Activation version; prior version remains historical.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyActivation'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                policy_guid: 01990f5b-bbb9-7000-8000-000000000001
                legal_entity_guid: 01990f5b-bbb9-7000-8000-000000000001
                effective_from: '2026-10-28'
                status: ACTIVE
                version: 1
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/tax-quotes:
    post:
      operationId: quoteTax
      x-permission: tax.quote
      parameters:
      - $ref: '#/components/parameters/Entity'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxQuoteRequest'
            example:
              business_date: '2026-10-28'
              party_account_guid: 01990f5b-bbb9-7000-8000-000000000001
              sku_guid: 01990f5b-bbb9-7000-8000-000000000001
              transaction_type: SALE
              taxable_net: '120000'
      responses:
        '200':
          description: Quote and immutable rule version reference; issue recalculates
            under transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxQuote'
              example:
                rule_version_guid: 01990f5b-bbb9-7000-8000-000000000001
                taxable_net: '1'
                dpp: '1'
                tax: '1'
                gross: '1'
                currency: IDR
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/org-nodes/{guid}/deactivate:
    post:
      operationId: deactivateOrgNode
      x-owner: platform
      x-permission: organization.manage
      summary: 'deactivateOrgNode: INACTIVE'
      parameters:
      - $ref: '#/components/parameters/Entity'
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
              required:
              - reason
            example:
              reason: Approved for pilot
      responses:
        '200':
          description: INACTIVE state committed by Platform; fetch aggregate for full
            detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: INACTIVE
                version: 2
                operation_guid: 01990f5b-bbb9-7000-8000-000000000002
          headers:
            ETag:
              schema:
                type: string
              example: '"2"'
        default:
          description: Error status is 400/401/403/404/409/412/422/429/503 as applicable;
            code is stable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: ORG_NODE_IN_USE
                message: Request cannot be completed
                details: {}
                request_id: req-01990f5b
      x-error-codes:
      - ORG_NODE_IN_USE
  /api/v1/org-nodes/{guid}/branch-warehouse-assignments:
    post:
      operationId: assignBranchWarehouse
      x-owner: platform
      x-permission: organization.manage
      summary: 'assignBranchWarehouse: ACTIVE'
      parameters:
      - $ref: '#/components/parameters/Entity'
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                branch_guid:
                  type: string
                  format: uuid
                warehouse_guid:
                  type: string
                  format: uuid
                effective_from:
                  type: string
                  format: date
                effective_to:
                  type:
                  - string
                  - 'null'
                  format: date
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
              required:
              - branch_guid
              - warehouse_guid
              - effective_from
              - reason
            example:
              branch_guid: 01990f5b-bbb9-7000-8000-000000000002
              warehouse_guid: 01990f5b-bbb9-7000-8000-000000000002
              effective_from: '2026-10-28'
              reason: Approved for pilot
      responses:
        '201':
          description: ACTIVE state committed by Platform; fetch aggregate for full
            detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: ACTIVE
                version: 2
                operation_guid: 01990f5b-bbb9-7000-8000-000000000002
          headers:
            ETag:
              schema:
                type: string
              example: '"2"'
        default:
          description: Error status is 400/401/403/404/409/412/422/429/503 as applicable;
            code is stable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: WAREHOUSE_ENTITY_MISMATCH
                message: Request cannot be completed
                details: {}
                request_id: req-01990f5b
      x-error-codes:
      - WAREHOUSE_ENTITY_MISMATCH
      - ORG_EFFECTIVE_OVERLAP
  /api/v1/org-nodes/{guid}:
    get:
      operationId: getOrgNode
      x-owner: platform
      x-permission: organization.read
      summary: Tenant scoped organization node including parent, effective interval
        and version.
      parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Tenant scoped organization node including parent, effective
            interval and version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgNodeRead'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000002
                parent_guid: 01990f5b-bbb9-7000-8000-000000000002
                kind: pilot-reference
                code: PILOT-01
                name: Pilot entity
                status: pilot-reference
                effective_from: '2026-10-28'
                version: 1
        default:
          description: Error status is 400/401/403/404/409/412/422/429/503 as applicable;
            code is stable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: RESOURCE_NOT_FOUND
                message: Request cannot be completed
                details: {}
                request_id: req-01990f5b
      x-error-codes: []
    patch:
      operationId: updateOrgNode
      x-owner: platform
      x-permission: organization.manage
      summary: 'updateOrgNode: DRAFT'
      parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                effective_from:
                  type: string
                  format: date
                effective_to:
                  type:
                  - string
                  - 'null'
                  format: date
              minProperties: 1
            example:
              name: Pilot entity
      responses:
        '200':
          description: DRAFT state committed by Platform; fetch aggregate for full
            detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: DRAFT
                version: 2
                operation_guid: 01990f5b-bbb9-7000-8000-000000000002
          headers:
            ETag:
              schema:
                type: string
              example: '"2"'
        default:
          description: Error status is 400/401/403/404/409/412/422/429/503 as applicable;
            code is stable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: ORG_NODE_IN_USE
                message: Request cannot be completed
                details: {}
                request_id: req-01990f5b
      x-error-codes:
      - ORG_NODE_IN_USE
  /api/v1/users/invitations:
    post:
      operationId: inviteUser
      x-owner: platform
      x-permission: iam.user.invite
      summary: 'inviteUser: INVITED'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 320
                role_guid:
                  type: string
                  format: uuid
                legal_entity_guid:
                  type: string
                  format: uuid
                branch_guid:
                  type:
                  - string
                  - 'null'
                  format: uuid
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
              required:
              - email
              - role_guid
              - legal_entity_guid
              - reason
            example:
              email: staff@example.invalid
              role_guid: 01990f5b-bbb9-7000-8000-000000000002
              legal_entity_guid: 01990f5b-bbb9-7000-8000-000000000002
              reason: Approved for pilot
      responses:
        '201':
          description: INVITED state committed by Platform; fetch aggregate for full
            detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: INVITED
                version: 1
                operation_guid: 01990f5b-bbb9-7000-8000-000000000002
          headers:
            ETag:
              schema:
                type: string
              example: '"2"'
        default:
          description: Error status is 400/401/403/404/409/412/422/429/503 as applicable;
            code is stable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: IAM_EMAIL_EXISTS
                message: Request cannot be completed
                details: {}
                request_id: req-01990f5b
      x-error-codes:
      - IAM_EMAIL_EXISTS
      - IAM_SCOPE_ESCALATION
  /api/v1/users/{guid}:
    get:
      operationId: getUserState
      x-owner: platform
      x-permission: iam.user.read
      summary: Scoped user state; no raw credential or token.
      parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Scoped user state; no raw credential or token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000002
                display_name: pilot-reference
                status: pilot-reference
                session_version: 1
                version: 1
        default:
          description: Error status is 400/401/403/404/409/412/422/429/503 as applicable;
            code is stable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: RESOURCE_NOT_FOUND
                message: Request cannot be completed
                details: {}
                request_id: req-01990f5b
      x-error-codes: []
  /api/v1/users/{guid}/role-grants/{grant_guid}/revoke:
    post:
      operationId: revokeUserRoleGrant
      x-owner: platform
      x-permission: iam.role.assign
      summary: 'revokeUserRoleGrant: REVOKED'
      parameters:
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: grant_guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
              required:
              - reason
            example:
              reason: Approved for pilot
      responses:
        '200':
          description: REVOKED state committed by Platform; fetch aggregate for full
            detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: REVOKED
                version: 2
                operation_guid: 01990f5b-bbb9-7000-8000-000000000002

components:
  securitySchemes:
    webhookHmac:
      type: apiKey
      in: header
      name: X-ERP-Signature
      description: HMAC-SHA256 signature bound to X-ERP-Timestamp and raw request
        body; connector-specific secret and replay window are enforced by Platform.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Entity:
      name: X-Legal-Entity-Guid
      in: header
      required: true
      schema:
        type: string
        format: uuid
    Guid:
      name: guid
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
  responses:
    Problem:
      description: Stable domain error; response body never contains secret or unmasked
        PII.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            success: false
            code: ORG_PARENT_INVALID
            message: Invalid parent
            details: {}
            request_id: req-01990f5b
  schemas:
    Decimal:
      type: string
      pattern: ^-?\d{1,14}(\.\d{1,6})?$
    DecisionReason:
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
    CreateOrgNode:
      type: object
      additionalProperties: false
      required:
      - kind
      - parent_guid
      - code
      - name
      properties:
        kind:
          type: string
          enum:
          - COMPANY
          - LEGAL_ENTITY
          - BRANCH
          - WAREHOUSE
        parent_guid:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 200
    OrgNode:
      type: object
      additionalProperties: false
      required:
      - guid
      - kind
      - parent_guid
      - code
      - name
      - status
      - version
      - scope_version
      properties:
        guid:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - COMPANY
          - LEGAL_ENTITY
          - BRANCH
          - WAREHOUSE
        parent_guid:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - INACTIVE
        version:
          type: integer
          format: int64
          minimum: 1
        scope_version:
          type: integer
          format: int64
          minimum: 1
    RoleGrantRequest:
      type: object
      additionalProperties: false
      required:
      - role_guid
      - legal_entity_guid
      - effective_from
      - reason
      properties:
        role_guid:
          type: string
          format: uuid
        legal_entity_guid:
          type: string
          format: uuid
        branch_guid:
          type:
          - string
          - 'null'
          format: uuid
        warehouse_guid:
          type:
          - string
          - 'null'
          format: uuid
        effective_from:
          type: string
          format: date-time
        effective_to:
          type:
          - string

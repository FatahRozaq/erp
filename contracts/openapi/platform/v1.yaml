          type: integer
          minimum: 1
    PublishPolicy:
      type: object
      additionalProperties: false
      required:
      - simulation_result_hash
      - reason
      properties:
        simulation_result_hash:
          type: string
          pattern: ^[a-f0-9]{64}$
        reason:
          type: string
          minLength: 3
          maxLength: 500
    TaxSimulationOutput:
      type: object
      additionalProperties: false
      required:
      - dpp_base
      - vat_base
      - gross_base
      - rule_guid
      properties:
        dpp_base:
          $ref: '#/components/schemas/Decimal'
        vat_base:
          $ref: '#/components/schemas/Decimal'
        gross_base:
          $ref: '#/components/schemas/Decimal'
        rule_guid:
          type: string
          format: uuid
    PriceSimulationOutput:
      type: object
      additionalProperties: false
      required:
      - unit_price
      - discount_base
      - net_base
      - rule_guid
      properties:
        unit_price:
          $ref: '#/components/schemas/Decimal'
        discount_base:
          $ref: '#/components/schemas/Decimal'
        net_base:
          $ref: '#/components/schemas/Decimal'
        rule_guid:
          type: string
          format: uuid
    CreditSimulationOutput:
      type: object
      additionalProperties: false
      required:
      - gross_exposure_base
      - eligible_deposit_base
      - net_exposure_base
      - available_base
      - decision
      properties:
        gross_exposure_base:
          $ref: '#/components/schemas/Decimal'
        eligible_deposit_base:
          $ref: '#/components/schemas/Decimal'
        net_exposure_base:
          $ref: '#/components/schemas/Decimal'
        available_base:
          $ref: '#/components/schemas/Decimal'
        decision:
          type: string
          enum:
          - ALLOW
          - HOLD
    ApprovalSimulationOutput:
      type: object
      additionalProperties: false
      required:
      - required_role_guids
      - sod_pass
      properties:
        required_role_guids:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
        sod_pass:
          type: boolean
    PostingSimulationOutput:
      type: object
      additionalProperties: false
      required:
      - legs
      - balanced
      properties:
        legs:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - account_guid
            - side
            - amount_base
            properties:
              account_guid:
                type: string
                format: uuid
              side:
                type: string
                enum:
                - DEBIT
                - CREDIT
              amount_base:
                $ref: '#/components/schemas/Decimal'
        balanced:
          type: boolean
    NumberingSimulationOutput:
      type: object
      additionalProperties: false
      required:
      - next_document_no
      - reused_retry_result
      properties:
        next_document_no:
          type: string
        reused_retry_result:
          type: boolean
    SimulationFailure:
      type: object
      additionalProperties: false
      required:
      - error_code
      - reason
      properties:
        error_code:
          type: string
        reason:
          type: string

openapi: 3.1.1
info:
  title: ERP Pos Roadmap API
  version: 1.0.0
  description: Contract for bounded Enterprise Expansion owner operations.
servers:
- url: https://erp.example.invalid
security:
- bearerAuth: []
paths:
  /api/v1/pos/shifts:
    post:
      operationId: openPosShift
      x-owner: commercial
      x-stage: EXP
      x-permission: pos.shift.open
      x-error-codes: [POS_PROVIDER_OUTCOME_UNKNOWN]
      summary: openPosShift — OPEN; authoritative owner state and idempotent retry.
      parameters:
      - name: X-Legal-Entity-Guid
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - register_guid
              - cashier_guid
              - opening_cash_base
              properties:
                register_guid:
                  type: string
                  format: uuid
                cashier_guid:
                  type: string
                  format: uuid
                opening_cash_base:
                  type: string
                  pattern: ^\d{1,14}(\.\d{1,6})?$
            example:
              register_guid: 01990f5b-bbb9-7000-8000-000000000001
              cashier_guid: 01990f5b-bbb9-7000-8000-000000000002
              opening_cash_base: '100.000000'
      responses:
        '201':
          description: Owner committed this state or persisted an explicit pending operation; inspect the resource
            before assuming downstream completion.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - guid
                - status
                - version
                - operation_guid
                properties:
                  guid:
                    type: string
                    format: uuid
                  status:
                    type: string
                  version:
                    type: integer
                    minimum: 1
                  operation_guid:
                    type: string
                    format: uuid
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: OPEN
                version: 1
                operation_guid: 01990f5b-bbb9-7000-8000-000000000002
        default:
          description: Stable ERP error; 400/401/403/404/409/412/422/429/503 as applicable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: SOURCE_STATE_CONFLICT
                message: Request cannot be completed
                details: {}
                request_id: req-01990f5b
    get:
      x-owner: commercial
      x-stage: EXP
      x-permission: pos.shift.read
      summary: Read scoped PosShift state; owner is authoritative.
      operationId: listPosShifts
      parameters:
      - name: X-Legal-Entity-Guid
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 25
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Scoped cursor page.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                - next_cursor
                - as_of
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                      - guid
                      - status
                      - version
                      - data
                      properties:
                        guid:
                          type: string
                          format: uuid
                        status:
                          type: string
                        version:
                          type: integer
                          minimum: 1
                        data:
                          type: object
                          additionalProperties: false
                          required:
                          - register_guid
                          - cashier_guid
                          - opening_cash_base
                          properties:
                            register_guid:
                              type: string
                              format: uuid
                            cashier_guid:
                              type: string
                              format: uuid
                            opening_cash_base:
                              type: string
                              pattern: ^\d{1,14}(\.\d{1,6})?$
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  as_of:
                    type: string
                    format: date-time
              example:
                items:
                - guid: 01990f5b-bbb9-7000-8000-000000000001
                  status: DRAFT
                  version: 1
                  data:
                    register_guid: 01990f5b-bbb9-7000-8000-000000000001
                    cashier_guid: 01990f5b-bbb9-7000-8000-000000000002
                    opening_cash_base: '100.000000'
                next_cursor: null
                as_of: '2026-11-01T10:00:00Z'
        default:
          description: Scoped 401/403/409/503 error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: SOURCE_STATE_CONFLICT
                message: Request cannot be completed
                details: {}
                request_id: req-01990f5b
  /api/v1/pos/sales:
    post:
      operationId: checkoutPosSale
      x-owner: commercial
      x-stage: EXP
      x-permission: pos.sale.checkout
      x-error-codes: [POS_PROVIDER_OUTCOME_UNKNOWN]
      summary: checkoutPosSale — PENDING_PAYMENT; authoritative owner state and idempotent retry.
      x-emits:
      - pos.sale.completed.v1
      x-emits-on-status: COMPLETED
      parameters:
      - name: X-Legal-Entity-Guid
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - shift_guid
              - cart_hash
              - lines
              - payment_method
              - amount_base
              properties:
                shift_guid:
                  type: string
                  format: uuid
                cart_hash:
                  type: string
                  pattern: ^[a-f0-9]{64}$
                lines:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    additionalProperties: false
                    required:
                    - sku_guid
                    - qty_base
                    - unit_price_base
                    properties:
                      sku_guid:
                        type: string
                        format: uuid
                      qty_base:
                        type: string
                        pattern: ^\d{1,14}(\.\d{1,6})?$
                      unit_price_base:
                        type: string
                        pattern: ^\d{1,14}(\.\d{1,6})?$
                payment_method:
                  type: string
                  minLength: 1
                  maxLength: 500
                amount_base:
                  type: string
                  pattern: ^\d{1,14}(\.\d{1,6})?$
            example:
              shift_guid: 01990f5b-bbb9-7000-8000-000000000001
              cart_hash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
              lines:
              - sku_guid: 01990f5b-bbb9-7000-8000-000000000002
                qty_base: '2.000000'
                unit_price_base: '100.000000'
              payment_method: CARD
              amount_base: '222.000000'
      responses:
        '202':
          description: Owner committed this state or persisted an explicit pending operation; inspect the resource
            before assuming downstream completion.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - guid
                - status
                - version
                - operation_guid
                properties:
                  guid:
                    type: string
                    format: uuid
                  status:
                    type: string
                  version:
                    type: integer
                    minimum: 1
                  operation_guid:
                    type: string
                    format: uuid
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: PENDING_PAYMENT
                version: 1
                operation_guid: 01990f5b-bbb9-7000-8000-000000000002
        default:
          description: Stable ERP error; 400/401/403/404/409/412/422/429/503 as applicable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: SOURCE_STATE_CONFLICT
                message: Request cannot be completed
                details: {}
                request_id: req-01990f5b
    get:
      x-owner: commercial
      x-stage: EXP
      x-permission: pos.sale.read

  /api/v1/pos/sales/{guid}/refund:
    post:
      operationId: refundPosSale
      x-owner: commercial
      x-stage: EXP
      x-permission: pos.sale.refund
      x-error-codes: [POS_PROVIDER_OUTCOME_UNKNOWN]
      summary: refundPosSale — REFUND_PENDING; authoritative owner state and idempotent retry.
      x-emits:
      - pos.sale.refunded.v1
      parameters:
      - name: X-Legal-Entity-Guid
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - amount_base
              - reason
              - evidence_guid
              properties:
                amount_base:
                  type: string
                  pattern: ^\d{1,14}(\.\d{1,6})?$
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
                evidence_guid:
                  type: string
                  format: uuid
            example:
              amount_base: '100.000000'
              reason: Eligible returned line
              evidence_guid: 01990f5b-bbb9-7000-8000-000000000002
      responses:
        '202':
          description: Owner committed this state or persisted an explicit pending operation; inspect the resource
            before assuming downstream completion.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - guid
                - status
                - version
                - operation_guid
                properties:
                  guid:
                    type: string
                    format: uuid
                  status:
                    type: string
                  version:
                    type: integer
                    minimum: 1
                  operation_guid:
                    type: string
                    format: uuid
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001

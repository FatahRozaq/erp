        required: true
        schema:
          type: string
          format: uuid
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Current owner aggregate.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - guid
                - status
                - version
                - data
                properties:
                  guid:
                    type: string
                    format: uuid
                  status:
                    type: string
                  version:
                    type: integer
                    minimum: 1
                  data:
                    type: object
                    additionalProperties: false
                    required:
                    - bank_account_guid
                    - period_start
                    - period_end
                    - file_sha256
                    - opening_base
                    - closing_base
                    properties:
                      bank_account_guid:
                        type: string
                        format: uuid
                      period_start:
                        type: string
                        format: date
                      period_end:
                        type: string
                        format: date
                      file_sha256:
                        type: string
                        pattern: ^[a-f0-9]{64}$
                      opening_base:
                        type: string
                        pattern: ^\d{1,14}(\.\d{1,6})?$
                      closing_base:
                        type: string
                        pattern: ^\d{1,14}(\.\d{1,6})?$
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: DRAFT
                version: 1
                data:
                  bank_account_guid: 01990f5b-bbb9-7000-8000-000000000001
                  period_start: '2026-11-01'
                  period_end: '2026-11-30'
                  file_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                  opening_base: '100.000000'
                  closing_base: '130.000000'
        default:
          description: Scoped 401/403/404/503 error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: SOURCE_STATE_CONFLICT
                message: Request cannot be completed
                details: {}
                request_id: req-01990f5b
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Entity:
      name: X-Legal-Entity-Guid
      in: header
      required: true
      schema:
        type: string
        format: uuid
    Guid:
      name: guid
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
  responses:
    Problem:
      description: Stable scoped business error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            success: false
            code: FINANCE_SOURCE_ALREADY_INVOICED
            message: Source already invoiced
            details: {}
            request_id: req-01990f5b
  schemas:
    Money:
      type: string
      pattern: ^\d{1,14}(\.\d{1,6})?$
    Qty:
      type: string
      pattern: ^\d{1,14}(\.\d{1,6})?$
    SalesInvoiceDraftRequest:
      type: object
      additionalProperties: false
      required:
      - customer_account_guid
      - business_date
      - source_portion_guids
      properties:
        customer_account_guid:
          type: string
          format: uuid
        business_date:
          type: string
          format: date
        source_portion_guids:
          type: array
          minItems: 1
          maxItems: 200
          uniqueItems: true
          items:
            type: string
            format: uuid
    VendorInvoiceDraftRequest:
      type: object
      additionalProperties: false
      required:
      - vendor_account_guid
      - vendor_invoice_no
      - tax_period
      - business_date
      - lines
      properties:
        vendor_account_guid:
          type: string
          format: uuid
        vendor_invoice_no:
          type: string
          minLength: 1
          maxLength: 100
        tax_period:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}$
        business_date:
          type: string
          format: date
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required:
            - purchase_order_line_guid
            - goods_receipt_line_guid
            - qty_base
            - unit_net_price
            properties:
              purchase_order_line_guid:
                type: string
                format: uuid
              goods_receipt_line_guid:
                type: string
                format: uuid
              qty_base:
                $ref: '#/components/schemas/Qty'
              unit_net_price:
                $ref: '#/components/schemas/Money'
    Invoice:
      type: object
      additionalProperties: false
      required:
      - guid
      - invoice_type
      - status
      - currency
      - net
      - tax
      - gross
      - lines
      - version
      properties:
        guid:
          type: string
          format: uuid
        invoice_type:
          type: string
          enum:
          - SALES
          - VENDOR
        status:
          type: string
          enum:
          - DRAFT
          - MATCH_EXCEPTION
          - READY
          - ISSUED
          - PARTIALLY_PAID
          - PAID
        document_no:
          type:
          - string
          - 'null'
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        net:
          $ref: '#/components/schemas/Money'
        tax:
          $ref: '#/components/schemas/Money'
        gross:
          $ref: '#/components/schemas/Money'
        journal_guid:
          type:
          - string
          - 'null'
          format: uuid
        lines:
          type: array
          items:
            type: object
            required:
            - source_guid
            - qty_base
            - net
            - tax
            - gross
            - match_status
            properties:
              source_guid:
                type: string
                format: uuid
              qty_base:
                $ref: '#/components/schemas/Qty'
              net:
                $ref: '#/components/schemas/Money'
              tax:
                $ref: '#/components/schemas/Money'
              gross:
                $ref: '#/components/schemas/Money'
              match_status:
                type: string
                enum:
                - MATCHED
                - EXCEPTION
                - NOT_APPLICABLE
              error_code:
                type:
                - string
                - 'null'
        version:
          type: integer
          minimum: 1
    PaymentRequest:
      type: object
      additionalProperties: false
      required:
      - party_account_guid
      - business_date
      - currency
      - amount
      - bank_reference
      - allocations
      properties:
        party_account_guid:
          type: string
          format: uuid
        business_date:
          type: string
          format: date
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        amount:
          $ref: '#/components/schemas/Money'
        bank_reference:
          type: string
          minLength: 1
          maxLength: 128
        allocations:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required:
            - open_item_guid
            - amount
            properties:
              open_item_guid:
                type: string
                format: uuid
              amount:
                $ref: '#/components/schemas/Money'
    Payment:
      type: object
      additionalProperties: false
      required:
      - guid
      - status
      - amount
      - allocated_amount
      - unapplied_amount
      - currency
      - version
      properties:
        guid:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - DRAFT
          - APPROVED
          - POSTED
          - REVERSED
        amount:
          $ref: '#/components/schemas/Money'
        allocated_amount:
          $ref: '#/components/schemas/Money'
        unapplied_amount:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        journal_guid:
          type:
          - string
          - 'null'
          format: uuid
        version:
          type: integer
          minimum: 1
    OpenItemPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      - as_of
      properties:
        items:
          type: array
          items:
            type: object
            required:
            - guid
            - invoice_guid
            - original_gross
            - allocated
            - credited
            - outstanding
            - due_date
            - source_type
            - source_guid
            properties:
              guid:
                type: string
                format: uuid
              invoice_guid:
                type:
                - string
                - 'null'
                format: uuid
              original_gross:
                $ref: '#/components/schemas/Money'
              allocated:
                $ref: '#/components/schemas/Money'
              credited:
                $ref: '#/components/schemas/Money'
              outstanding:
                $ref: '#/components/schemas/Money'
              due_date:
                type: string
                format: date
              source_type:
                type: string
                enum:
                - INVOICE
                - OPENING_BALANCE
              source_guid:
                type: string
                format: uuid
        next_cursor:
          type:
          - string
          - 'null'
        as_of:
          type: string
          format: date
    Problem:
      type: object
      additionalProperties: false
      required:
      - success
      - code
      - message
      - details
      - request_id
      properties:
        success:
          type: boolean
          const: false
        code:
          type: string
        message:
          type: string
        details:
          type: object
        request_id:
          type: string
    getAgingReportResult:
      type: object
      additionalProperties: false
      required:
      - as_of
      - currency
      - watermark
      - generated_at
      - rows
      properties:
        as_of:
          type: string
          format: date
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        watermark:
          type: string
        generated_at:
          type: string
          format: date-time
        rows:
          type: array
          items:
            $ref: '#/components/schemas/AgingRow'
    AgingRow:
      type: object
      additionalProperties: false
      required:
      - party_account_guid
      - current_base
      - days_1_30_base
      - days_31_60_base
      - days_61_90_base
      - days_over_90_base
      - outstanding_base
      properties:
        party_account_guid:
          type: string
          format: uuid
        current_base: &id003
          type: string
          pattern: ^-?\d{1,14}(\.\d{1,6})?$
        days_1_30_base: *id003
        days_31_60_base: *id003
        days_61_90_base: *id003
        days_over_90_base: *id003
        outstanding_base: *id003
    CommandReceipt:
      type: object
      additionalProperties: false
      required:
      - guid
      - status
      - version
      - operation_guid
      properties:
        guid: &id004
          type: string
          format: uuid
        status:
          type: string
        version:
          type: integer
          minimum: 1
        operation_guid: *id004
    TaxDocumentRead:
      type: object
      additionalProperties: false
      required:
      - guid
      - invoice_guid
      - status
      - version
      properties:
        guid: &id005
          type: string
          format: uuid
        invoice_guid: *id005
        status:
          type: string
          enum:
          - DRAFT
          - READY_FOR_EXPORT
          - EXPORTED
          - ACKNOWLEDGED
          - REJECTED
        external_ref: &id006
          type:
          - string
          - 'null'
          maxLength: 500
        file_sha256: *id006
        evidence_guid:
          type:
          - string
          - 'null'
          format: uuid
        version:
          type: integer
          minimum: 0
    CorrectionClaimRequest:
      type: object
      additionalProperties: false
      required:
      - correction_guid
      - expected_source_version
      properties:
        correction_guid: *id001
        expected_source_version:
          type: integer
          minimum: 1
    CorrectionClaim:
      type: object
      additionalProperties: false
      required:
      - claim_guid
      - source_portion_guid
      - status
      - version
      - created_at
      properties:
        claim_guid: *id001
        source_portion_guid: *id001
        status:
          type: string
          enum:
          - HELD
          - APPLIED
          - ABORTED
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
    AbortClaimRequest:
      type: object
      additionalProperties: false
      required:
      - reason
      - verified_no_correction
      properties:
        reason:
          type: string
          minLength: 3
        verified_no_correction:
          const: true

openapi: 3.1.1
info:
  title: ERP Finance AR AP API
  version: 1.0.0
  description: MVP invoices, three-way match, receipts, supplier payments and open items. ISSUED/POSTED
    always has a posted local Finance journal.
servers:
- url: https://erp.example.invalid
security:
- bearerAuth: []
paths:
  /api/v1/finance/sales-invoices:
    post:
      operationId: createSalesInvoiceDraft
      x-permission: finance.invoice.create
      parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesInvoiceDraftRequest'
            example:
              customer_account_guid: 01990f5b-bbb9-7000-8000-000000000001
              business_date: '2026-10-28'
              source_portion_guids:
              - 01990f5b-bbb9-7000-8000-000000000002
      responses:
        '201':
          description: Draft with authoritative tax/cost/source quote.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                invoice_type: SALES
                status: DRAFT
                currency: IDR
                net: '600'
                tax: '66'
                gross: '666'
                lines:
                - source_guid: 01990f5b-bbb9-7000-8000-000000000001
                  qty_base: '3'
                  net: '600'
                  tax: '66'
                  gross: '666'
                  match_status: MATCHED
                version: 1
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/finance/sales-invoices/{guid}/issue:
    post:
      operationId: issueSalesInvoice
      x-permission: finance.invoice.issue
      parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/Guid'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Invoice ISSUED and journal POSTED in one Finance transaction; failure rolls back
            both.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                invoice_type: SALES
                status: ISSUED
                currency: IDR
                net: '600'
                tax: '66'
                gross: '666'
                lines:
                - source_guid: 01990f5b-bbb9-7000-8000-000000000001
                  qty_base: '3'
                  net: '600'
                  tax: '66'
                  gross: '666'
                  match_status: MATCHED
                version: 1
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/finance/vendor-invoices:
    post:
      operationId: createVendorInvoiceDraft
      x-permission: finance.vendor_invoice.create
      parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorInvoiceDraftRequest'
            example:
              vendor_account_guid: 01990f5b-bbb9-7000-8000-000000000001
              vendor_invoice_no: INV-VEN-001
              tax_period: 2026-10
              business_date: '2026-10-28'
              lines:
              - purchase_order_line_guid: 01990f5b-bbb9-7000-8000-000000000001
                goods_receipt_line_guid: 01990f5b-bbb9-7000-8000-000000000001
                qty_base: '10'
                unit_net_price: '100'
      responses:
        '201':
          description: Draft or MATCH_EXCEPTION; no AP/GL until exact match and issue.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                invoice_type: VENDOR
                status: DRAFT
                currency: IDR
                net: '1000'
                tax: '110'
                gross: '1110'
                lines:
                - source_guid: 01990f5b-bbb9-7000-8000-000000000001
                  qty_base: '10'
                  net: '1000'
                  tax: '110'
                  gross: '1110'
                  match_status: MATCHED
                version: 1
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/finance/vendor-invoices/{guid}/match:
    post:
      operationId: matchVendorInvoice
      x-permission: finance.vendor_invoice.match
      parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/Guid'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Exact PO/GRN/price match result and per-line exception details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                invoice_type: VENDOR
                status: READY
                currency: IDR
                net: '1000'
                tax: '110'
                gross: '1110'
                lines:
                - source_guid: 01990f5b-bbb9-7000-8000-000000000001
                  qty_base: '10'
                  net: '1000'
                  tax: '110'
                  gross: '1110'
                  match_status: MATCHED
                version: 1
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
  /api/v1/finance/vendor-invoices/{guid}/issue:
    post:
      operationId: issueVendorInvoice
      x-permission: finance.vendor_invoice.issue
      parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/Guid'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: AP invoice ISSUED and GRNI/input-tax/AP journal POSTED atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                invoice_type: VENDOR
                status: ISSUED
                currency: IDR
                net: '1000'
                tax: '110'
                gross: '1110'
                lines:
                - source_guid: 01990f5b-bbb9-7000-8000-000000000001
                  qty_base: '10'
                  net: '1000'
                  tax: '110'
                  gross: '1110'
                  match_status: MATCHED
                version: 1
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/finance/customer-receipts:
    post:
      operationId: createCustomerReceipt
      x-permission: finance.receipt.create
      parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
            example:
              party_account_guid: 01990f5b-bbb9-7000-8000-000000000001
              business_date: '2026-10-28'
              currency: IDR
              amount: '100'
              bank_reference: BANK-PILOT-001
              allocations:
              - open_item_guid: 01990f5b-bbb9-7000-8000-000000000001
                amount: '60'
      responses:
        '201':
          description: Draft customer receipt; allocations are rechecked on post.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: DRAFT
                amount: '100'
                allocated_amount: '60'
                unapplied_amount: '40'
                currency: IDR
                version: 1
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/finance/customer-receipts/{guid}/post:
    post:
      operationId: postCustomerReceipt
      x-permission: finance.receipt.post
      x-emits:
      - finance.payment.posted.v1
      parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/Guid'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Receipt, allocation, open item and bank/AR journal committed once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: POSTED
                amount: '100'
                allocated_amount: '60'
                unapplied_amount: '40'
                currency: IDR
                version: 3
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/finance/supplier-payments:
    post:
      operationId: createSupplierPayment
      x-permission: finance.payment.create
      parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
            example:
              party_account_guid: 01990f5b-bbb9-7000-8000-000000000001
              business_date: '2026-10-28'
              currency: IDR
              amount: '100'
              bank_reference: BANK-PILOT-001
              allocations:
              - open_item_guid: 01990f5b-bbb9-7000-8000-000000000001
                amount: '60'
      responses:
        '201':
          description: Draft supplier payment requiring approval.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: DRAFT
                amount: '100'
                allocated_amount: '60'
                unapplied_amount: '40'
                currency: IDR
                version: 1
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/finance/supplier-payments/{guid}/post:
    post:
      operationId: postSupplierPayment
      x-permission: finance.payment.post
      x-emits:
      - finance.payment.posted.v1
      parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/Guid'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Approved supplier payment and AP/bank journal posted once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: POSTED
                amount: '100'
                allocated_amount: '60'
                unapplied_amount: '40'
                currency: IDR
                version: 3
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/finance/open-items:
    get:
      operationId: listOpenItems
      x-permission: finance.open_item.read
      parameters:
      - $ref: '#/components/parameters/Entity'
      - name: party_guid
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: type
        in: query
        required: true
        schema:
          type: string
          enum:
          - AR
          - AP
      - name: as_of
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Scoped paginated open items as of requested date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenItemPage'
              example:
                items:
                - guid: 01990f5b-bbb9-7000-8000-000000000001
                  invoice_guid: 01990f5b-bbb9-7000-8000-000000000001
                  original_gross: '1'
                  allocated: '1'
                  credited: '1'
                  outstanding: '40'
                  due_date: '2026-10-28'
                  source_type: INVOICE
                  source_guid: 01990f5b-bbb9-7000-8000-000000000001
                next_cursor: cursor-example
                as_of: '2026-10-28'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/finance/vendor-invoices/{guid}:
    patch:
      operationId: reviseVendorInvoiceDraft
      x-owner: finance
      x-permission: finance.vendor_invoice.create
      summary: 'reviseVendorInvoiceDraft: DRAFT'
      parameters:
      - $ref: '#/components/parameters/Entity'
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                vendor_reference:
                  type: string
                  minLength: 1
                  maxLength: 500
                source_portion_guids:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: uuid
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
              required:
              - vendor_reference
              - source_portion_guids
              - reason
            example:
              vendor_reference: pilot-reference
              source_portion_guids:
              - 01990f5b-bbb9-7000-8000-000000000002
              reason: Approved for pilot
      responses:
        '200':
          description: DRAFT state committed by Finance; fetch aggregate for full detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: DRAFT
                version: 2
                operation_guid: 01990f5b-bbb9-7000-8000-000000000002
          headers:
            ETag:
              schema:
                type: string
              example: '"2"'
        default:
          description: Error status is 400/401/403/404/409/412/422/429/503 as applicable; code is stable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: INVOICE_ALREADY_ISSUED
                message: Request cannot be completed
                details: {}
                request_id: req-01990f5b
      x-error-codes:
      - INVOICE_ALREADY_ISSUED
  /api/v1/finance/payments/{guid}/approve:
    post:
      operationId: approvePayment
      x-owner: finance
      x-permission: finance.payment.approve
      summary: 'approvePayment: APPROVED'
      parameters:
      - $ref: '#/components/parameters/Entity'
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
              required:
              - reason
            example:
              reason: Approved for pilot
      responses:
        '200':
          description: APPROVED state committed by Finance; fetch aggregate for full detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: APPROVED
                version: 2
                operation_guid: 01990f5b-bbb9-7000-8000-000000000002
          headers:
            ETag:
              schema:
                type: string
              example: '"2"'
        default:
          description: Error status is 400/401/403/404/409/412/422/429/503 as applicable; code is stable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: APPROVAL_SOD_VIOLATION
                message: Request cannot be completed
                details: {}
                request_id: req-01990f5b
      x-error-codes:
      - APPROVAL_SOD_VIOLATION
  /api/v1/finance/payments/{guid}/reverse:
    post:
      operationId: reversePayment
      x-owner: finance
      x-permission: finance.document.reverse
      summary: Reverse the complete posted payment and every allocation; partial reversal is outside MVP.
      description: Path guid and response guid identify the original payment; a separate reversal document is linked by the emitted event. Customer receipt reversal requires an ACTIVE Commercial Credit hold before Finance commits.
      parameters:
      - $ref: '#/components/parameters/Entity'
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
                evidence_guid:
                  type: string
                  format: uuid
                business_date:
                  type: string
                  format: date
              required:
              - reason
              - evidence_guid
              - business_date
            example:
              reason: Approved for pilot
              evidence_guid: 01990f5b-bbb9-7000-8000-000000000002
              business_date: '2026-10-28'
      responses:
        '201':
          description: REVERSED state committed by Finance; fetch aggregate for full detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: REVERSED
                version: 4
                operation_guid: 01990f5b-bbb9-7000-8000-000000000002
          headers:
            ETag:
              schema:
                type: string
              example: '"4"'
        default:
          description: Error status is 400/401/403/404/409/412/422/429/503 as applicable; code is stable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: PAYMENT_ALREADY_REVERSED
                message: Request cannot be completed
                details: {}
                request_id: req-01990f5b
      x-error-codes:
      - PAYMENT_ALREADY_REVERSED
      - PERIOD_CLOSED
      x-emits:
      - finance.payment.reversed.v1
  /api/v1/finance/payments/{guid}/unapplied-allocations:
    post:
      operationId: applyUnappliedCash
      x-owner: finance
      x-permission: finance.receipt.allocate
      summary: Apply part of posted unapplied cash to one open item; payment remains POSTED.
      parameters:
      - $ref: '#/components/parameters/Entity'
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                open_item_guid:
                  type: string
                  format: uuid
                amount:
                  type: string
                  pattern: ^(?:[1-9]\d{0,13})(?:\.\d{1,6})?$
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
              required:
              - open_item_guid
              - amount
              - reason
            example:
              open_item_guid: 01990f5b-bbb9-7000-8000-000000000002
              amount: '100.00'
              reason: Approved for pilot
      responses:
        '201':
          description: Allocation and reclassification journal committed; payment remains POSTED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: POSTED
                version: 4
                operation_guid: 01990f5b-bbb9-7000-8000-000000000002
          headers:
            ETag:
              schema:
                type: string
              example: '"4"'
        default:
          description: Error status is 400/401/403/404/409/412/422/429/503 as applicable; code is stable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: PAYMENT_UNAPPLIED_INSUFFICIENT
                message: Request cannot be completed
                details: {}
                request_id: req-01990f5b
      x-error-codes:
      - PAYMENT_UNAPPLIED_INSUFFICIENT
      x-emits:
      - finance.payment.allocation_applied.v1
  /api/v1/finance/tax-documents/{guid}:
    get:
      operationId: getTaxDocument
      x-owner: finance
      x-permission: finance.tax_document.read
      summary: Tax document status, export checksum and external acknowledgement evidence.
      parameters:
      - $ref: '#/components/parameters/Entity'
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Tax document status, export checksum and external acknowledgement evidence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxDocumentRead'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000002
                invoice_guid: 01990f5b-bbb9-7000-8000-000000000002
                status: EXPORTED
                version: 1
        default:
          description: Error status is 400/401/403/404/409/412/422/429/503 as applicable; code is stable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: RESOURCE_NOT_FOUND
                message: Request cannot be completed
                details: {}
                request_id: req-01990f5b
      x-error-codes: []
  /api/v1/finance/tax-documents/{guid}/status:
    post:
      operationId: recordTaxDocumentStatus
      x-owner: finance
      x-permission: finance.tax_document.manage
      summary: 'recordTaxDocumentStatus: STATUS_RECORDED'
      parameters:
      - $ref: '#/components/parameters/Entity'
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                status:
                  type: string
                  enum:
                  - DRAFT
                  - READY_FOR_EXPORT
                  - EXPORTED
                  - ACKNOWLEDGED
                  - REJECTED
                evidence_guid:
                  type: string
                  format: uuid
                external_ref:
                  type:
                  - string
                  - 'null'
                  maxLength: 500
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
              required:
              - status
              - evidence_guid
              - reason
            example:
              status: EXPORTED
              evidence_guid: 01990f5b-bbb9-7000-8000-000000000002
              reason: Approved for pilot
      responses:
        '200':

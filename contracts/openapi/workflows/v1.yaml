openapi: 3.1.1
info:
  title: ERP Platform Workflow API
  version: 1.0.0
  description: MVP approval inbox, import jobs, private documents, notifications and scoped search.
servers:
- url: https://erp.example.invalid
security:
- bearerAuth: []
paths:
  /api/v1/approvals:
    get:
      operationId: listApprovalInbox
      x-permission: approval.inbox.read
      parameters:
      - $ref: '#/components/parameters/Entity'
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Pending decisions filtered by current actor permission/scope and SoD.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalPage'
              example:
                items:
                - guid: 01990f5b-bbb9-7000-8000-000000000001
                  source_guid: 01990f5b-bbb9-7000-8000-000000000001
                  step_no: 1
                  status: PENDING
                  policy_version_guid: 01990f5b-bbb9-7000-8000-000000000001
                  version: 1
                next_cursor: cursor-example
        '403':
          $ref: '#/components/responses/Problem'
  /api/v1/approvals/{guid}/decide:
    post:
      operationId: decideApproval
      x-permission: approval.decide
      parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/Guid'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
            example:
              decision: APPROVE
              reason: example
      responses:
        '200':
          description: Immutable step decision; source owner receives event asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                source_guid: 01990f5b-bbb9-7000-8000-000000000001
                step_no: 1
                status: APPROVED
                policy_version_guid: 01990f5b-bbb9-7000-8000-000000000001
                version: 1
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/import-jobs:
    post:
      operationId: createImportJob
      x-permission: data.import
      parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
            example:
              template_type: SKU
              template_version: 1
              filename: pilot-sku.csv
              size_bytes: 1024
              sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
              source_system: ERP_LEGACY
      responses:
        '201':
          description: Quarantine upload reservation, private URL and job GUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: UPLOADED
                template_type: SKU
                valid_count: 1
                error_count: 1
                version: 1
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/import-jobs/{guid}/preview:
    post:
      operationId: previewImportJob
      x-permission: data.import
      parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/Guid'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Scan and parse queued; poll job status for row results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: PREVIEW_READY
                template_type: SKU
                valid_count: 1
                error_count: 1
                version: 1
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
  /api/v1/import-jobs/{guid}/commit:
    post:
      operationId: commitImportJob
      x-permission: data.import.commit
      parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/Guid'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitImport'
            example:
              preview_hash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
              reason: example
      responses:
        '202':
          description: Per-row domain commands queued; partial results remain visible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: COMPLETED
                template_type: SKU
                valid_count: 1
                error_count: 1
                version: 1
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/import-jobs/{guid}:
    get:
      operationId: getImportJob
      x-permission: data.import.read
      parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/Guid'
      responses:
        '200':
          description: Status, counts and safe row-error summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: UPLOADED
                template_type: SKU
                valid_count: 1
                error_count: 1
                version: 1
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/documents/uploads:
    post:
      operationId: createDocumentUpload
      x-permission: document.upload
      parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentUploadRequest'
            example:
              owner_type: POD
              owner_guid: 01990f5b-bbb9-7000-8000-000000000001
              media_type: image/jpeg
              size_bytes: 1024
              sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
              retention_class: FINANCIAL_10Y
      responses:
        '201':
          description: Private signed URL; document remains PENDING_SCAN until clean.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentUpload'
              example:
                document_guid: 01990f5b-bbb9-7000-8000-000000000001
                upload_url: https://erp.example.invalid/private/example
                expires_at: '2026-10-28T10:00:00Z'
                status: PENDING_SCAN
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/documents/{guid}:
    get:
      operationId: getDocumentMetadata
      x-permission: document.view
      parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/Guid'
      responses:
        '200':
          description: Metadata and scan status; separate authorized action generates download URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                owner_type: example
                owner_guid: 01990f5b-bbb9-7000-8000-000000000001
                sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                media_type: example
                size_bytes: 1
                scan_status: PENDING_SCAN
                version: 1
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/documents/{guid}/download:
    post:
      operationId: createDocumentDownload
      x-permission: document.download
      parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/Guid'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Short-lived private URL; access audited and only CLEAN objects allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadUrl'
              example:
                url: https://erp.example.invalid/private/example
                expires_at: '2026-10-28T10:00:00Z'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/search:
    get:
      operationId: searchScopedResources
      x-permission: search.read
      parameters:
      - $ref: '#/components/parameters/Entity'
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 100
      - name: type
        in: query
        required: true
        schema:
          type: string
          enum:
          - SKU
          - CUSTOMER
          - VENDOR
          - SO
          - PO
          - INVOICE
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Scoped results with indexed-at freshness; not authoritative for stock/credit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPage'
              example:
                items:
                - guid: 01990f5b-bbb9-7000-8000-000000000001
                  type: SKU
                  label: example
                next_cursor: cursor-example
                indexed_at: '2026-10-28T10:00:00Z'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/import-templates/{code}:
    get:
      operationId: getImportTemplate
      x-owner: platform
      x-permission: data.import
      summary: Exact UTF-8 CSV header, required columns, field formats and maximum rows.
      parameters:
      - $ref: '#/components/parameters/Entity'
      - name: code
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
      responses:
        '200':
          description: Exact UTF-8 CSV header, required columns, field formats and maximum rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportTemplateRead'
              example:
                code: SKU_V1
                version: 1
                header_csv: external_id,code,name,base_uom_code,product_category,tax_class,lot_required,serial_required
                columns:
                - name: external_id
                  type: STRING
                  required: true
                - name: code
                  type: STRING
                  required: true
                - name: name
                  type: STRING
                  required: true
                - name: base_uom_code
                  type: STRING
                  required: true
                - name: product_category
                  type: STRING
                  required: true
                - name: tax_class
                  type: STRING
                  required: true
                - name: lot_required
                  type: ENUM
                  required: true
                - name: serial_required
                  type: ENUM
                  required: true
                max_rows: 10000
                max_bytes: 10000000
        default:
          description: Error status is 400/401/403/404/409/412/422/429/503 as applicable; code is stable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: RESOURCE_NOT_FOUND
                message: Request cannot be completed
                details: {}
                request_id: req-01990f5b
      x-error-codes: []
  /api/v1/import-jobs/{guid}/rows:
    get:
      operationId: listImportRowResults
      x-owner: platform
      x-permission: data.import
      summary: Per row outcome and stable error code; scoped and paginated.
      parameters:
      - $ref: '#/components/parameters/Entity'
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - VALID
          - INVALID
          - COMMITTED
          - FAILED
      - name: cursor
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
          maxLength: 500
      responses:
        '200':
          description: Per row outcome and stable error code; scoped and paginated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportRowReadPage'
              example:
                items:
                - row_no: 1
                  status: INVALID
                  safe_message: Reference not found
                  error_code: IMPORT_REFERENCE_NOT_FOUND
                  field: sku_code
                  external_id: legacy-1
                next_cursor: null
                watermark: '2026-10-28T10:00:00Z'
        default:
          description: Error status is 400/401/403/404/409/412/422/429/503 as applicable; code is stable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: RESOURCE_NOT_FOUND
                message: Request cannot be completed
                details: {}
                request_id: req-01990f5b
      x-error-codes: []
  /api/v1/notifications:
    get:
      operationId: listNotifications
      x-owner: platform
      x-permission: notification.read
      summary: In-app notifications reauthorized against current scope.
      parameters:
      - $ref: '#/components/parameters/Entity'
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - UNREAD
          - READ
          - ACKNOWLEDGED
      - name: cursor
        in: query
        required: false
        schema:
          type:
          - string
          - 'null'
          maxLength: 500
      responses:
        '200':
          description: In-app notifications reauthorized against current scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationReadPage'
              example:
                items:
                - guid: 01990f5b-bbb9-7000-8000-000000000002
                  source_guid: 01990f5b-bbb9-7000-8000-000000000002
                  type: pilot-reference
                  status: pilot-reference
                  created_at: '2026-10-28T10:00:00Z'
                next_cursor: null
                watermark: '2026-10-28T10:00:00Z'
        default:
          description: Error status is 400/401/403/404/409/412/422/429/503 as applicable; code is stable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: RESOURCE_NOT_FOUND
                message: Request cannot be completed
                details: {}
                request_id: req-01990f5b
      x-error-codes: []
  /api/v1/notifications/{guid}/acknowledge:
    post:
      operationId: acknowledgeNotification
      x-owner: platform
      x-permission: notification.read
      summary: 'acknowledgeNotification: ACKNOWLEDGED'
      parameters:
      - $ref: '#/components/parameters/Entity'
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: ACKNOWLEDGED state committed by Platform; fetch aggregate for full detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: ACKNOWLEDGED
                version: 2
                operation_guid: 01990f5b-bbb9-7000-8000-000000000002
          headers:
            ETag:
              schema:
                type: string
              example: '"2"'
        default:
          description: Error status is 400/401/403/404/409/412/422/429/503 as applicable; code is stable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: NOTIFICATION_SCOPE_REVOKED
                message: Request cannot be completed
                details: {}
                request_id: req-01990f5b
      x-error-codes:
      - NOTIFICATION_SCOPE_REVOKED
  /api/v1/report-jobs:
    post:
      operationId: createReportJob
      x-owner: platform
      x-permission: report.run
      summary: 'createReportJob: QUEUED'
      parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                report_type:
                  type: string
                  enum:
                  - TRIAL_BALANCE
                  - PNL
                  - AGING_AR
                  - AGING_AP
                  - STOCK_VALUATION
                as_of:
                  type: string
                  format: date
                format:
                  type: string
                  enum:
                  - CSV
                  - PDF
              required:
              - report_type
              - as_of
              - format
            example:
              report_type: AGING_AR
              as_of: '2026-10-28'
              format: CSV
      responses:
        '202':
          description: QUEUED state committed by Platform; fetch aggregate for full detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000001
                status: QUEUED
                version: 1
                operation_guid: 01990f5b-bbb9-7000-8000-000000000002
          headers:
            ETag:
              schema:
                type: string
              example: '"2"'
        default:
          description: Error status is 400/401/403/404/409/412/422/429/503 as applicable; code is stable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: REPORT_SCOPE_INVALID
                message: Request cannot be completed
                details: {}
                request_id: req-01990f5b
      x-error-codes:
      - REPORT_SCOPE_INVALID
  /api/v1/report-jobs/{guid}:
    get:
      operationId: getReportJob
      x-owner: platform
      x-permission: report.run
      summary: Scoped status and watermark of asynchronous report/export job.
      parameters:
      - $ref: '#/components/parameters/Entity'
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Scoped status and watermark of asynchronous report/export job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportJobRead'
              example:
                guid: 01990f5b-bbb9-7000-8000-000000000002
                report_type: AGING_AR
                status: pilot-reference
                as_of: '2026-10-28'
                watermark: pilot-reference
        default:
          description: Error status is 400/401/403/404/409/412/422/429/503 as applicable; code is stable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: RESOURCE_NOT_FOUND
                message: Request cannot be completed
                details: {}
                request_id: req-01990f5b
      x-error-codes: []
  /api/v1/report-jobs/{guid}/download:
    post:
      operationId: createReportDownload
      x-owner: platform
      x-permission: report.export
      summary: 'createReportDownload: READY'
      parameters:
      - $ref: '#/components/parameters/Entity'
      - name: guid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: READY state committed by Platform; fetch aggregate for full detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadGrant'
              example:
                url: https://erp.example.invalid/private/downloads/temporary
                expires_at: '2026-10-28T10:00:00Z'
                sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          headers:
            ETag:
              schema:
                type: string
              example: '"2"'
        default:
          description: Error status is 400/401/403/404/409/412/422/429/503 as applicable; code is stable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                success: false
                code: REPORT_NOT_READY
                message: Request cannot be completed
                details: {}
                request_id: req-01990f5b
      x-error-codes:
      - REPORT_NOT_READY
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Entity:
      name: X-Legal-Entity-Guid
      in: header
      required: true
      schema:
        type: string
        format: uuid
    Guid:
      name: guid
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
  responses:
    Problem:
      description: Stable scoped error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            success: false
            code: IMPORT_SNAPSHOT_CHANGED
            message: File changed after preview
            details: {}
            request_id: req-01990f5b
  schemas:
    DecisionRequest:
      type: object
      additionalProperties: false
      required:
      - decision
      - reason
      properties:
        decision:
          type: string
          enum:
          - APPROVE
          - REJECT
          - RETURN
        reason:
          type: string
          minLength: 3
          maxLength: 500
    Approval:
      type: object
      additionalProperties: false
      required:
      - guid
      - source_guid
      - step_no
      - status
      - policy_version_guid
      - version
      properties:
        guid:
          type: string
          format: uuid
        source_guid:
          type: string
          format: uuid
        step_no:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - RETURNED
          - EXPIRED
        policy_version_guid:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
    ApprovalPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Approval'
        next_cursor:
          type:
          - string
          - 'null'
    ImportRequest:
      type: object
      additionalProperties: false
      required:
      - template_type
      - template_version
      - filename
      - size_bytes
      - sha256
      - source_system
      properties:
        template_type:
          type: string
          enum: &id001
          - SKU
          - CUSTOMER
          - VENDOR
          - OPENING_STOCK
          - OPENING_AR
          - OPENING_AP
          - COA
        template_version:
          type: integer
          minimum: 1
        filename:
          type: string
          minLength: 1
          maxLength: 255
        size_bytes:
          type: integer
          minimum: 1
          maximum: 10000000
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        source_system:
          type: string
          minLength: 1
          maxLength: 100
    CommitImport:
      type: object
      additionalProperties: false
      required:
      - preview_hash
      - reason
      properties:
        preview_hash:
          type: string
          pattern: ^[a-f0-9]{64}$
        reason:
          type: string
          minLength: 3
          maxLength: 500
    ImportJob:
      type: object
      additionalProperties: false
      required:
      - guid
      - status
      - template_type
      - valid_count
      - error_count
      - version
      properties:
        guid:
          type: string
          format: uuid
        status:
          type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Entity:
      name: X-Legal-Entity-Guid
      in: header
      required: true
      description: Selected context; authorization is checked server-side.
      schema:
        type: string
        format: uuid
    Guid:
      name: guid
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag quoted aggregate version.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
  responses:
    Problem:
      description: Domain error; same shape on all statuses.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            success: false
            code: PURCHASE_PO_STALE_VERSION
            message: Purchase order changed; reload before retrying
            details: {}
            request_id: req-01990f5b
  schemas:
    Decimal:
      type: string
      pattern: ^\d{1,14}(\.\d{1,6})?$
    CreatePo:
      type: object
      additionalProperties: false
      required:
      - branch_guid
      - vendor_account_guid
      - currency_code
      - lines
      properties:
        branch_guid:
          type: string
          format: uuid
        vendor_account_guid:
          type: string
          format: uuid
        currency_code:
          type: string
          pattern: ^[A-Z]{3}$
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required:
            - sku_guid
            - qty_base
            - unit_price
            - entered_qty
            - entered_uom_guid
            properties:
              sku_guid:
                type: string
                format: uuid
              qty_base:
                $ref: '#/components/schemas/Decimal'
              unit_price:
                $ref: '#/components/schemas/Decimal'
              entered_qty:
                type: string
                pattern: ^\d{1,14}(\.\d{1,6})?$
              entered_uom_guid:
                type: string
                format: uuid
              conversion_version_guid:
                type:
                - string
                - 'null'
                format: uuid
    Po:
      type: object
      additionalProperties: false
      required:
      - guid
      - legal_entity_guid
      - branch_guid
      - vendor_account_guid
      - status
      - currency_code
      - lines
      - version
      properties:
        guid:
          type: string
          format: uuid
        legal_entity_guid:
          type: string
          format: uuid
        branch_guid:
          type: string
          format: uuid
        vendor_account_guid:
          type: string
          format: uuid
        document_no:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - DRAFT
          - WAITING_APPROVAL
          - APPROVED
          - PARTIALLY_RECEIVED
          - RECEIVED
          - CLOSED
          - REJECTED
          - CANCELLED
        currency_code:
          type: string
        lines:
          type: array
          items:
            type: object
            required:
            - guid
            - sku_guid
            - qty_base
            - unit_price
            - received_qty
            - entered_qty
            - entered_uom_guid
            - conversion_version_guid
            properties:
              guid:
                type: string
                format: uuid
              sku_guid:
                type: string
                format: uuid
              qty_base:
                $ref: '#/components/schemas/Decimal'
              unit_price:
                $ref: '#/components/schemas/Decimal'
              received_qty:
                $ref: '#/components/schemas/Decimal'
              entered_qty:
                type: string
                pattern: ^\d{1,14}(\.\d{1,6})?$
              entered_uom_guid:
                type: string
                format: uuid
              conversion_version_guid:
                type:
                - string
                - 'null'
                format: uuid
        version:
          type: integer
          format: int64
          minimum: 1
    Problem:
      type: object
      additionalProperties: false
      required:
      - success
      - code
      - message
      - details
      - request_id
      properties:
        success:
          type: boolean
          const: false
        code:
          type: string
        message:
          type: string
        details:
          type: object
        request_id:
          type: string
    CommandReceipt:
      type: object
      additionalProperties: false
      required:
      - guid
      - status
      - version
      - operation_guid
      properties:
        guid: &id001
          type: string
          format: uuid
        status:
          type: string
        version:
          type: integer
          minimum: 1
        operation_guid: *id001
